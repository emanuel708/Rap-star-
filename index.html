<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<title>Pro Football Star V8 - Enhanced</title>
<style>
:root{--bg:#07101f;--p:#101d35;--p2:#172847;--line:#2a416b;--t:#f3f7ff;--m:#9eafc9;--g:#23d18b;--gold:#ffc857;--red:#ff647c;--blue:#66a8ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#102448,#07101f 58%);color:var(--t);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(85px + env(safe-area-inset-bottom))}
.app{max-width:520px;margin:auto;padding:12px}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.top,.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.eyebrow,.tiny,.sub{color:var(--m);font-size:11px;line-height:1.5}
.money{color:var(--gold);font-weight:900}
.hero{display:grid;grid-template-columns:90px 1fr;gap:13px;align-items:center}
.avatar{width:90px;height:108px;border-radius:14px;display:grid;place-items:center;font-size:58px;background:#1b3156;border:1px solid #45608e; transition: transform 0.2s;}
.name{font-size:21px;font-weight:900}
.badge,.pill{display:inline-block;background:#091426;border:1px solid var(--line);border-radius:99px;padding:5px 8px;font-size:10px;margin:3px 3px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.stat{background:#091426;border:1px solid #243959;border-radius:10px;padding:8px 4px;text-align:center; transition: all 0.3s;}
.stat.up { background: #1a3a2a; border-color: var(--g); transform: scale(1.05); }
.stat b{display:block;font-size:18px}
.stat span{font-size:9px;color:var(--m)}
.meter{height:6px;background:#091426;border-radius:9px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--g); transition: width 0.3s ease;}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.action{min-height:76px;text-align:left;background:var(--p2);color:var(--t);border:1px solid var(--line);border-radius:13px;padding:12px;font-weight:800; transition: transform 0.1s;}
.action:active{transform:scale(0.97)}
.action strong{display:block;font-size:22px}
.primary{background:linear-gradient(135deg,#1677ef,#0ab987);border:0}
.matchbtn{background:linear-gradient(135deg,#a65b13,#cf344f);border:0}
.action:disabled,.btn:disabled{opacity:.35; transform:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.section-title{font-size:16px;font-weight:900;margin:0 0 10px}
.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:8px 4px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;background:#050c19f5;border-top:1px solid var(--line)}
.nav button{background:none;border:0;color:var(--m);font-size:10px;font-weight:800;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:55px}
.nav .ico{font-size:20px}
.overlay{display:none;position:fixed;inset:0;z-index:10;background:#020711dd;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:520px;max-height:88dvh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 15px calc(22px + env(safe-area-inset-bottom))}
.modalhead{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:900;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}
.close{border:0;border-radius:50%;background:var(--p2);color:white;width:34px;height:34px}
.item{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{background:var(--blue);color:#061225;border:0;border-radius:9px;padding:10px 12px;font-weight:900}
.btn.secondary{background:var(--p2);color:var(--t);border:1px solid var(--line)}
.btn.green{background:var(--g)}
.btn.red{background:var(--red)}
.choice{display:block;width:100%;text-align:left;background:var(--p2);border:1px solid var(--line);border-radius:12px;color:var(--t);padding:14px;margin-top:9px;line-height:1.4}
.choice b{display:block;margin-bottom:4px}
.feed{border-left:3px solid var(--gold);padding:8px 0 8px 12px;margin:10px 0;line-height:1.45}
.field{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#081426;color:white;margin:7px 0}
.score{font-size:32px;font-weight:1000;text-align:center}
/* Notificaciones Toast */
#toast-container { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:10px; width: 90%; max-width: 400px; pointer-events:none;}
.toast { background: #1a2a47; border-left: 4px solid var(--g); padding: 12px 16px; border-radius: 8px; color: white; box-shadow: 0 8px 24px rgba(0,0,0,0.6); animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, fadeOut 0.4s 3s forwards; font-size: 13px; line-height:1.4;}
@keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }
@media(min-width:520px){.overlay{align-items:center}.modal{border-radius:22px}}
</style>
</head>
<body>
<main class="app">
<header class="top">
    <div><div class="eyebrow" id="dateLabel"></div><div style="font-weight:900;margin-top:4px" id="clubLabel"></div><div class="tiny" id="seasonLabel"></div></div>
    <div style="text-align:right"><div class="money">💰 $<span id="money"></span></div><div class="pill">⚡ <span id="energy"></span>% energía</div></div>
</header>

<section class="card">
    <div class="hero">
        <div class="avatar" id="avatar">⚽</div>
        <div><div class="eyebrow">TU CARRERA</div><div class="name" id="nameLabel"></div><div class="sub" id="playerMeta"></div><span class="badge" id="ovrBadge"></span><span class="badge" id="moodBadge"></span><div class="sub" id="injuryText"></div></div>
    </div>
    <div class="stats" id="stats"></div>
</section>

<section class="card">
    <div class="row"><h2 class="section-title">Tu semana</h2><span class="pill" id="nextEvent"></span></div>
    <div class="meter"><i id="energyBar"></i></div><div class="sub" id="objective" style="margin-top:9px"></div>
</section>

<section class="actions">
    <button class="action matchbtn" id="matchBtn" onclick="startMatch()"><strong>⚽</strong>JUGAR PARTIDO<small class="sub" id="matchSub"></small></button>
    <button class="action primary" id="trainBtn" onclick="openTraining()"><strong>🏃</strong>ENTRENAR<small class="sub">Mejora habilidades</small></button>
    <button class="action" onclick="openLife()"><strong>📱</strong>VIDA PERSONAL<small class="sub">Familia, redes y descanso</small></button>
    <button class="action" onclick="advanceDay()"><strong>⏳</strong>AVANZAR DÍA<small class="sub">Recupera y sigue la historia</small></button>
</section>

<section class="card">
    <div class="row"><h2 class="section-title">Últimas noticias</h2><span class="pill">Carrera</span></div>
    <div id="news"></div>
</section>
</main>

<nav class="nav">
    <button onclick="closeModal()"><span class="ico">🏠</span>INICIO</button>
    <button onclick="openCareer()"><span class="ico">🌍</span>CARRERA</button>
    <button onclick="openShop()"><span class="ico">🛒</span>TIENDA</button>
    <button onclick="openStyle()"><span class="ico">🎨</span>JUGADOR</button>
    <button onclick="openHistory()"><span class="ico">📖</span>HISTORIA</button>
</nav>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="modal"><div class="modalhead"><span id="modalTitle"></span><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div>
</div>

<script>
"use strict";
const DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const CLUBS={"Club de Barrio":{ovr:0,league:"Amateur",salary:100,color:"#23d18b"},"Envigado FC":{ovr:52,league:"Colombia",salary:650,color:"#f97316"},"Deportivo Cali":{ovr:58,league:"Colombia",salary:1000,color:"#22c55e"},"Atlético Nacional":{ovr:64,league:"Colombia",salary:1800,color:"#22c55e"},"Millonarios":{ovr:65,league:"Colombia",salary:1800,color:"#60a5fa"},"Boca Juniors":{ovr:70,league:"Argentina",salary:3000,color:"#eab308"},"River Plate":{ovr:72,league:"Argentina",salary:3500,color:"#f8fafc"},"FC Barcelona":{ovr:84,league:"España",salary:50000,color:"#60a5fa"},"Real Madrid":{ovr:87,league:"España",salary:75000,color:"#f8fafc"},"Manchester City":{ovr:88,league:"Inglaterra",salary:85000,color:"#38bdf8"}};

// Ampliada la tienda con objetos que escalan a final del juego y negocios pasivos
const SHOP=[
    {id:"hoodie",name:"Hoodie urbano exclusivo",desc:"+3 afición. Letras árabes, estilo callejero.",price:450,type:"hype",value:3,icon:"🧥"},
    {id:"console",name:"Consola",desc:"+3 moral al descansar",price:800,type:"morale",value:3,icon:"🎮"},
    {id:"moto_ax100",name:"Moto AX 100",desc:"+5 moral al escapar de la rutina",price:1200,type:"morale",value:5,icon:"🏍️"},
    {id:"phone",name:"Teléfono premium",desc:"+4 afición al comprar",price:3200,type:"hype",value:4,icon:"📱"},
    {id:"boots",name:"Botas profesionales",desc:"+5 forma al comprarlas",price:4500,type:"fitness",value:5,icon:"👟"},
    {id:"nutrition",name:"Nutricionista",desc:"+5 energía al descansar",price:6000,type:"energy",value:5,icon:"🥗"},
    {id:"taller",name:"Taller Automotriz",desc:"Negocio: Ingreso pasivo de +$500 mensuales",price:15000,type:"business",value:500,icon:"🔧"},
    {id:"watch",name:"Reloj de lujo",desc:"+6 afición al comprar",price:15000,type:"hype",value:6,icon:"⌚"},
    {id:"car",name:"Camioneta",desc:"+10 afición al comprar",price:18000,type:"hype",value:10,icon:"🚙"},
    {id:"home",name:"Casa mejorada",desc:"+5 energía y moral al descansar",price:30000,type:"home",value:5,icon:"🏡"},
    {id:"car_upgrade",name:"Auto deportivo",desc:"+12 afición al comprar",price:42000,type:"hype",value:12,icon:"🏎️"},
    {id:"apartment",name:"Apartamento de lujo",desc:"+5 moral al comprar",price:65000,type:"morale",value:5,icon:"🏙️"},
    {id:"private_jet",name:"Vuelo Privado Charter",desc:"+15 afición y +10 moral",price:250000,type:"hype",value:15,icon:"✈️"}
];

const fresh=()=>({version:8.1,name:"Promesa",number:9,day:1,week:1,season:1,money:500,energy:100,fitness:80,morale:80,hype:10,stats:{pac:50,sho:50,pas:50,dri:50,def:35,phy:50},club:"Club de Barrio",salary:100,injury:0,assets:[],goals:0,assists:0,matches:0,wins:0,losses:0,draws:0,seasonGoals:0,seasonAssists:0,seasonMatches:0,relationship:55,coachTrust:35,scandal:0,playedToday:false,firstTrial:false,offerSeen:false,history:[],matchLog:[],socialPosts:[],partner:"",avatar:{skin:"#b77950",hair:"corto"},storyFlags:{},training:0});
let s=fresh(),match=null;

const $=id=>document.getElementById(id);
const clamp=(n,min=0,max=100)=>Math.max(min,Math.min(max,Number(n)||0));
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Sistema de Notificaciones Toast (Feedback visual)
function showToast(msg) {
    let tc = $('toast-container');
    if(!tc) { tc = document.createElement('div'); tc.id = 'toast-container'; document.body.appendChild(tc); }
    let t = document.createElement('div'); t.className = 'toast'; t.innerHTML = msg;
    tc.appendChild(t);
    setTimeout(() => { if(t.parentNode) t.remove(); }, 3500);
}

function save(){try{localStorage.setItem("proFootballStarV8",JSON.stringify(s))}catch(e){}}
function load(){try{let p=JSON.parse(localStorage.getItem("proFootballStarV8"));if(!p||!p.version)return false;s={...fresh(),...p,stats:{...fresh().stats,...p.stats},avatar:{...fresh().avatar,...p.avatar},assets:Array.isArray(p.assets)?p.assets:[],history:Array.isArray(p.history)?p.history:[],matchLog:Array.isArray(p.matchLog)?p.matchLog:[],socialPosts:Array.isArray(p.socialPosts)?p.socialPosts:[]};return true}catch(e){return false}}

function ovr(){return Math.round(s.stats.pac*.15+s.stats.sho*.22+s.stats.pas*.16+s.stats.dri*.2+s.stats.def*.1+s.stats.phy*.17)}

function addNews(msg, silent = false){
    s.history.unshift({week:s.week,season:s.season,msg});
    s.history=s.history.slice(0,35);
    $("news").innerHTML=s.history.slice(0,3).map(n=>`<div class="feed"><span class="tiny">T${n.season} · S${n.week}</span><br>${esc(n.msg)}</div>`).join("");
    if(!silent) showToast(msg);
    save();
}

function modal(title,html){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("overlay").style.display="flex"}
function closeModal(){$("overlay").style.display="none"}
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeModal()});

function render(){
    s.energy=clamp(s.energy);s.fitness=clamp(s.fitness);s.morale=clamp(s.morale);s.hype=clamp(s.hype);
    $("dateLabel").textContent=`${DAYS[s.day-1]||"Lunes"} · Semana ${s.week}`;
    $("clubLabel").textContent=s.club;$("seasonLabel").textContent=`Temporada ${s.season} · ${s.club==="Club de Barrio"?"Promesa":"Profesional"}`;
    $("money").textContent=Math.floor(s.money).toLocaleString("es-CO");
    $("energy").textContent=Math.round(s.energy);
    $("nameLabel").textContent=s.name;
    $("playerMeta").textContent=`Delantero · #${s.number} · ${CLUBS[s.club]?.league||"Profesional"}`;
    $("ovrBadge").textContent=`OVR ${ovr()}`;
    $("moodBadge").textContent=`Moral ${Math.round(s.morale)}`;
    $("injuryText").textContent=s.injury>0?`🩹 Lesionado: ${s.injury} día(s)`:"";
    $("energyBar").style.width=`${s.energy}%`;
    
    const stats=[["RIT",s.stats.pac,"pac"],["TIR",s.stats.sho,"sho"],["PAS",s.stats.pas,"pas"],["REG",s.stats.dri,"dri"],["DEF",s.stats.def,"def"],["FIS",s.stats.phy,"phy"],["FORMA",s.fitness,"fitness"],["FANS",s.hype,"hype"]];
    $("stats").innerHTML=stats.map(([n,v,k])=>`<div class="stat" id="stat-${k}"><b>${Math.round(v)}</b><span>${n}</span></div>`).join("");
    
    $("avatar").style.background=`linear-gradient(145deg,${CLUBS[s.club]?.color||"#334155"},#101d35)`;
    $("avatar").textContent=s.injury?"🩹":s.avatar.hair==="rubio"?"👱🏽":s.avatar.hair==="rapado"?"🧑🏽‍🦲":"🧑🏽‍🦱";
    
    const md=s.day===6||s.day===7;
    $("matchBtn").disabled=!md||s.injury>0||s.playedToday;
    $("matchSub").textContent=s.injury?`Lesión: ${s.injury} días`:s.playedToday?"Partido jugado":md?"Un partido esta semana (sábado o domingo)":"Disponible sábado y domingo";
    $("trainBtn").disabled=md||s.injury>0;
    $("nextEvent").textContent=md?"Día de partido":s.day===5?"Convocatoria":"Entrenamiento";
    $("objective").textContent=!s.firstTrial?"Objetivo: supera la primera prueba.":`Objetivo: mejora OVR (${ovr()}) y reputación (${Math.round(s.hype)}).`;
    
    if(!s.history.length) $("news").innerHTML='<div class="feed">El entrenador quiere conocerte. Demuestra que mereces una oportunidad.</div>';
    save();
}

function advanceDay(){
    if(s.injury>0){s.injury--;s.energy+=10}
    else{
        s.energy+=15+(s.assets.includes("nutrition")?5:0)+(s.assets.includes("home")?5:0);
        s.fitness+=5;
    }
    if(s.assets.includes("console")) s.morale+=3;
    if(s.assets.includes("home")) s.morale+=5;
    s.morale+=2;
    s.day++;
    
    if(s.day>7){
        s.day=1; s.playedToday=false; s.week++; s.money+=s.salary;
        // Economía balanceada: Impuestos de estilo de vida proporcionales y negocios
        if(s.week%4===0){
            let lifestyleCost = 150 + Math.floor(s.salary * 0.08); // 8% del salario se va en gastos para evitar acumulación infinita
            s.money = Math.max(0, s.money - lifestyleCost);
            let msg = `Fin de mes: pagaste $${lifestyleCost.toLocaleString("es-CO")} de gastos y mantenimiento.`;
            
            if(s.assets.includes("taller")) {
                s.money += 500;
                msg += " Tu Taller Automotriz generó $500.";
            }
            addNews(msg);
        }
        if(s.week>52){endSeason();return}
    }
    
    s.energy=clamp(s.energy); s.fitness=clamp(s.fitness); s.morale=clamp(s.morale);
    if(s.day===5&&!s.firstTrial) addNews("El entrenador anunció una prueba para el fin de semana. Llega en buena forma.");
    if(s.week>=2&&!s.offerSeen&&ovr()>=52&&s.matches>=2){s.offerSeen=true;addNews("Un ojeador de Envigado pregunta por ti. Revisa el mercado de fichajes.")}
    render();
}

function openTraining(){
    let items=[["pac","🏃","Ritmo"],["sho","🎯","Tiro"],["pas","👟","Pases"],["dri","🪄","Regate"],["def","🛡️","Defensa"],["phy","🏋️","Físico"]];
    modal("Centro de entrenamiento",`<p class="sub">Entrenar consume 25 de energía y avanza un día.</p>${items.map(([k,i,n])=>`<div class="item"><div><b>${i}${n}</b><div class="tiny">Actual: ${s.stats[k]}</div></div><button class="btn" onclick="train('${k}')">Entrenar</button></div>`).join("")}`)
}

function train(k){
    if(s.energy<25){ showToast("❌ No tienes energía suficiente. Descansa primero."); return; }
    s.energy-=25; s.fitness-=2; s.training++;
    
    if(Math.random()<.92-s.stats[k]/140){
        s.stats[k]=clamp(s.stats[k]+1,0,99);
        s.coachTrust=clamp(s.coachTrust+1);
        addNews(`✅ Buen entrenamiento: mejoraste ${({pac:"ritmo",sho:"tiro",pas:"pases",dri:"regate",def:"defensa",phy:"físico"})[k]}.`);
        setTimeout(() => {
            let el = $(`stat-${k}`);
            if(el) { el.classList.add('up'); setTimeout(()=>el.classList.remove('up'), 500); }
        }, 300);
    }else{
        addNews("⚠️ Entrenaste con intensidad, pero esta vez no hubo mejora técnica.");
    }
    
    if(s.energy<35&&Math.random()<.08){
        s.injury=2+Math.floor(Math.random()*4);
        addNews(`🏥 Sobrecarga: necesitarás ${s.injury} días de recuperación.`);
    }
    closeModal(); advanceDay();
}

// Ampliado el número de eventos para mayor variedad táctica
const EVENTS=[
    {text:"Recibes dentro del área. El portero achica y tu compañero aparece libre.",a:["Definir al primer palo","sho","goal"],b:["Asistir al compañero","pas","assist"]},
    {text:"Un defensor te cierra contra la banda. La grada espera algo especial.",a:["Intentar un regate","dri","show"],b:["Proteger y tocar atrás","phy","safe"]},
    {text:"Robo en mitad de cancha: hay espacio para la contra.",a:["Picar al espacio","pac","run"],b:["Cambiar el juego con un pase","pas","team"]},
    {text:"Tiro libre cerca del área. El capitán te ofrece patearlo.",a:["Pedir la responsabilidad","sho","goal"],b:["Dejarlo al especialista","pas","team"]},
    {text:"El rival presiona alto y estás rodeado.",a:["Salir jugando con técnica","dri","show"],b:["Jugar simple y asegurar","pas","safe"]},
    {text:"Centro al área chica en los últimos minutos.",a:["Rematar potente de cabeza","phy","goal"],b:["Intentar una volea acrobática","sho","goal"]},
    {text:"El extremo rival te supera en velocidad en un contragolpe.",a:["Hacer una falta táctica dura","def","safe"],b:["Correr a máxima velocidad para interceptar","pac","safe"]},
    {text:"Penalti a favor en un momento de máxima tensión.",a:["Tirar con potencia al centro","sho","goal"],b:["Colocar el balón a la escuadra","dri","goal"]}
];

function startMatch(){
    if(!(s.day===6||s.day===7)||s.injury||s.playedToday)return;
    if(s.energy<20&&!confirm("Tienes poca energía. ¿Jugar de todos modos?"))return;
    match={step:0,score:0,against:0,rating:6,events:[...EVENTS].sort(()=>Math.random()-.5).slice(0,3),opponent:["Atlético del Sur","Unión Central","Deportivo Montaña","Real del Valle","Sporting FC","Alianza Norte"][Math.floor(Math.random()*6)]};
    showPlay()
}

function showPlay(lastResult=""){
    let e=match.events[match.step];
    modal(`⚽ Partido · Jugada ${match.step+1}/3`,`${lastResult?`<div class="item" style="border-color:var(--gold)"><b>${esc(lastResult)}</b></div>`:""}<div class="pill">${esc(s.club)} vs ${esc(match.opponent)}</div><div class="score">${match.score} - ${match.against}</div><p class="sub" style="text-align:center">Minuto ${18+match.step*29} · Nota ${match.rating.toFixed(1)}</p><p style="font-size:16px;line-height:1.5">${e.text}</p><button class="choice" onclick="resolvePlay(0)"><b>${e.a[0]}</b><span class="tiny">Atributo clave: ${e.a[1].toUpperCase()}</span></button><button class="choice" onclick="resolvePlay(1)"><b>${e.b[0]}</b><span class="tiny">Atributo clave: ${e.b[1].toUpperCase()}</span></button>`)
}

function resolvePlay(which){
    let e=match.events[match.step],o=which?e.b:e.a,stat=s.stats[o[1]]||50;
    
    // Nueva fórmula de fatiga progresiva. A menos energía, más penalización porcentual.
    let baseChance = 18 + stat*.62 + ovr()*.18 + s.fitness*.08 + s.morale*.05 - s.scandal*3;
    let fatiguePenalty = ((100 - s.energy) * 0.15); // Pierdes hasta 15% de efectividad por cansancio
    let ch = clamp(baseChance - fatiguePenalty, 10, 95);
    
    let ok=Math.random()*100<ch,detail="",actionResult="";
    if(ok){
        match.rating+=.45;s.coachTrust=clamp(s.coachTrust+2);
        if(o[2]==="goal"||(o[2]==="run"&&Math.random()<.28)){
            match.score++;s.goals++;s.seasonGoals++;s.hype+=4;s.morale+=4;
            detail="⚽ ¡GOOOL! La jugada terminó en el fondo de la red.";actionResult="Gol marcado.";
        }else if(o[2]==="assist"||(o[2]==="team"&&Math.random()<.25)){
            s.assists++;s.seasonAssists++;s.hype+=2;
            detail="🎯 ¡ASISTENCIA! Tu pase dejó a un compañero solo para marcar.";actionResult="Pase decisivo y asistencia.";
        }else{
            detail=o[2]==="safe"?"✅ Jugada inteligente: mantuviste el control.":"✅ ¡Qué talento! La grada aplaude tu decisión.";actionResult="Acción completada.";
        }
    }else{
        match.rating-=.45;s.fitness-=3;s.coachTrust=clamp(s.coachTrust-1);
        if(Math.random()<.23){
            match.against++;detail="❌ Pérdida letal: el rival contragolpeó y marcó.";actionResult="Pérdida de balón; gol del rival.";
        }else{
            detail="⚠️ Error de ejecución: la jugada no salió como esperabas.";actionResult="Acción fallida.";
        }
        if(o[2]==="goal"){s.morale-=4;detail+=" Escuchas algunos silbidos desde la grada.";}
    }
    match.actions=match.actions||[];match.actions.push({minute:18+match.step*29,choice:o[0],result:actionResult,score:match.score+"-"+match.against});
    
    s.energy=clamp(s.energy-12);
    match.step++;
    if(match.step<3){showPlay(detail);}else{finishMatch(detail);}
}

function finishMatch(lastResult=""){
    let win=match.score>match.against,draw=match.score===match.against;
    s.matches++;s.seasonMatches++;s.playedToday=true;
    if(win){s.wins++;s.money+=150+(s.salary*0.2);s.hype+=5;s.coachTrust+=3}else if(draw){s.draws++;s.money+=60}else{s.losses++;s.coachTrust-=2}
    s.morale+=win?8:draw?2:-5;
    
    let result=`${match.score}-${match.against}`,summary=`Final: ${s.club} ${result} ${match.opponent}. Nota ${Math.max(1,Math.min(10,match.rating)).toFixed(1)}. ${win?"Victoria":draw?"Empate":"Derrota"}.`;
    let actionReport=(match.actions||[]).map(a=>`<div class="item"><div><b>Min. ${a.minute}: ${esc(a.choice)}</b><div class="tiny">${esc(a.result)} · Marcador ${esc(a.score)}</div></div></div>`).join("");
    
    s.matchLog=s.matchLog||[];s.matchLog.unshift({summary,week:s.week,season:s.season,actions:match.actions||[]});s.matchLog=s.matchLog.slice(0,25);
    match=null;
    
    if(!s.firstTrial){s.firstTrial=true;s.coachTrust+=8;s.newCareer=false;addNews("¡Superaste la primera prueba! El club te registra en la plantilla amateur.")}
    addNews(summary, true); render();
    modal("Final del partido",`<div class="score">${esc(result)}</div><p style="text-align:center">${esc(summary)}</p><h3 class="section-title">Tus decisiones</h3>${actionReport}<button class="btn green" style="width:100%" onclick="closeModal()">Continuar carrera</button>`)
}

const SOCIAL_FEED=[
    {who:"Mateo Ríos · Amigo",app:"Instagram",text:"Buen entrenamiento hoy. ¿Partido el sábado? 💪",kind:"friend"},
    {who:"Envigado FC · Cuenta oficial",app:"Twitter / X",text:"Estamos siguiendo a jóvenes talentos de la región 👀",kind:"club"},
    {who:"Valentina · Amiga",app:"Instagram",text:"La disciplina se nota más que las palabras ✨",kind:"friend"},
    {who:"Fútbol Total",app:"Twitter / X",text:"Rumor: varios clubes buscan delanteros jóvenes esta temporada.",kind:"media"},
    {who:"Aficionado",app:"Twitter / X",text:"¿Creen que esta promesa merece una oportunidad en primera?",kind:"fan"},
    {who:"Tu familia",app:"Instagram",text:"Siempre orgullosos de ti. No olvides de dónde vienes ❤️",kind:"family"}
];

function openSocial(app="Instagram"){
    s.socialPosts=s.socialPosts||[];
    let own=s.socialPosts.map(p=>({who:s.name,app:p.app,text:p.text,kind:"own",likes:p.likes}));
    let feed=[...own,...SOCIAL_FEED.filter(p=>app==="Todos"||p.app===app)];
    modal(app,`<div class="row"><span class="pill">📸 Instagram</span><span class="pill">🐦 Twitter / X</span></div><p class="sub">Seguidores: ${Math.max(12,Math.round(s.hype*127))} · Reputación ${Math.round(s.hype)}/100</p><div class="item"><div><b>✍️ Crear publicación</b><div class="tiny">Tus publicaciones impactan tu imagen.</div></div><button class="btn green" onclick="composePost('${app}')">Publicar</button></div><div class="row"><button class="btn secondary" onclick="openSocial('Instagram')">Instagram</button><button class="btn secondary" onclick="openSocial('Twitter / X')">Twitter / X</button><button class="btn secondary" onclick="openSocial('Todos')">Todos</button></div><h3 class="section-title">Feed</h3>${feed.slice(0,14).map(p=>`<div class="item" style="display:block"><b>${esc(p.who)}</b><div class="tiny">${esc(p.app)} ·${p.kind==="own"?"Tu publicación":"Público"}</div><p style="line-height:1.45">${esc(p.text)}</p>${p.kind==="own"?`<span class="pill">❤️ ${p.likes||0}</span>`:`<button class="btn secondary" onclick="reactPost('${p.kind}','${p.who}')">❤️ Me gusta</button>`}</div>`).join("")}`)
}

function composePost(app){modal("Crear publicación",`<p class="sub">Elige qué publicar en ${esc(app)}.</p><button class="choice" onclick="publishPost('${app}','training')"><b>🏋️ Día de trabajo</b><span class="tiny">El esfuerzo de hoy construye el jugador de mañana.</span></button><button class="choice" onclick="publishPost('${app}','team')"><b>🤝 Apoyar al equipo</b><span class="tiny">Primero el equipo. Vamos por más.</span></button><button class="choice" onclick="publishPost('${app}','bold')"><b>🔥 Mensaje desafiante</b><span class="tiny">Estoy listo para demostrar mi nivel. Puede generar polémica.</span></button><button class="choice" onclick="publishPost('${app}','life')"><b>❤️ Mensaje personal</b><span class="tiny">Agradecido por quienes siempre están.</span></button>`)}
function publishPost(app,type){let posts={training:"El esfuerzo de hoy construye el jugador de mañana. 💪",team:"Primero el equipo. Vamos por más. 🤝",bold:"Estoy listo para demostrar mi nivel. 🔥",life:"Agradecido por quienes siempre están. ❤️"};let text=posts[type],likes=8+Math.floor(Math.random()*90);s.socialPosts=s.socialPosts||[];s.socialPosts.unshift({app,text,likes});s.socialPosts=s.socialPosts.slice(0,20);if(type==="training"){s.hype+=2;s.coachTrust+=2;}if(type==="team"){s.hype+=3;s.coachTrust+=3;}if(type==="bold"){s.hype+=6;if(Math.random()<.35){s.scandal++;s.coachTrust-=4;addNews("Tu mensaje generó polémica. El técnico pidió humildad.");}}if(type==="life"){s.relationship=clamp(s.relationship+4);s.morale=clamp(s.morale+3);}addNews("Publicaste en "+app);save();openSocial(app);render()}
function reactPost(kind,who){if(kind==="friend"||kind==="family")s.relationship=clamp(s.relationship+1);if(kind==="club")s.hype+=1;addNews("Interactuaste con "+who+".");save();openSocial("Todos");render()}

function openRelations(){let partner=s.partner||"";modal("Amigos, clubes y pareja",`<div class="item"><div><b>🤝 Mateo Ríos · Amigo</b><div class="tiny">Relación ${Math.round(s.relationship||50)}/100</div></div><button class="btn" onclick="messageFriend()">Escribir</button></div><div class="item"><div><b>🏟️ Clubes que te observan</b></div><button class="btn" onclick="openSocial('Twitter / X')">Ver redes</button></div><div class="item"><div><b>💞 Pareja</b><div class="tiny">${partner?("Saliendo con "+esc(partner)):"Soltero/a."}</div></div><button class="btn" onclick="relationshipOptions()">Opciones</button></div>`)}
function messageFriend(){s.relationship=clamp((s.relationship||50)+5);s.morale=clamp(s.morale+2);addNews("Mateo te animó antes del próximo partido.");openRelations();render()}
function relationshipOptions(){modal("Vida sentimental",`<p class="sub">Tus relaciones necesitan atención, igual que tu carrera.</p><button class="choice" onclick="startRelationship()">💬 Invitar a Valentina a tomar un café · $40</button><button class="choice" onclick="messagePartner()">📱 Enviar mensaje amable · Gratis</button>${s.partner?'<button class="choice" onclick="endRelationship()">Terminar relación</button>':""}<button class="btn secondary" onclick="openRelations()">Volver</button>`)}
function startRelationship(){if(s.money<40){showToast("No tienes dinero suficiente.");return;}s.money-=40;s.partner="Valentina";s.relationship=clamp((s.relationship||50)+8);s.morale=clamp(s.morale+5);addNews("Tú y Valentina empezaron a salir.");save();openRelations();render()}
function messagePartner(){if(s.partner){s.relationship=clamp((s.relationship||50)+3);s.morale=clamp(s.morale+2);showToast("Cuidaste tu relación.");}else showToast("Le escribiste a Valentina.");save();openRelations();render()}
function endRelationship(){s.partner="";s.morale=clamp(s.morale-5);addNews("Terminaste la relación.");save();openRelations();render()}

function openLife(){modal("Vida personal",`<div class="item"><div><b>👨‍👩‍👧 Cena familiar</b><div class="tiny">+15 moral, mejora relación</div></div><button class="btn" onclick="life('family')">Ir · $60</button></div><div class="item"><div><b>📸 Instagram</b></div><button class="btn" onclick="openSocial('Instagram')">Abrir</button></div><div class="item"><div><b>🐦 Twitter / X</b></div><button class="btn" onclick="openSocial('Twitter / X')">Abrir</button></div><div class="item"><div><b>💬 Círculo íntimo</b></div><button class="btn" onclick="openRelations()">Ver</button></div><div class="item"><div><b>😴 Recuperación</b><div class="tiny">+35 energía, +12 forma</div></div><button class="btn" onclick="life('rest')">Descansar</button></div><div class="item"><div><b>🎙️ Entrevista</b></div><button class="btn" onclick="life('press')">Responder</button></div>`)}
function life(a){if(a==="family"){if(s.money<60)return showToast("No tienes dinero suficiente.");s.money-=60;s.morale+=15;s.relationship=clamp(s.relationship+8);addNews("Cenaste con tu familia.")}if(a==="rest"){s.energy+=35;s.fitness+=12;s.morale+=4;addNews("Priorizaste la recuperación muscular.")}if(a==="press"){modal("Zona mixta",`<p>Un periodista cuestiona tu forma reciente. ¿Qué respondes?</p><button class="choice" onclick="press('humble')"><b>“Seguiré trabajando por el equipo”</b><span class="tiny">Mejora confianza del DT</span></button><button class="choice" onclick="press('bold')"><b>“Merezco más protagonismo”</b><span class="tiny">Más fama, arriesgas relación</span></button>`);return}closeModal();clampAll();render()}
function press(k){if(k==="humble"){s.coachTrust+=5;s.morale+=2;addNews("Prensa elogia tu humildad.")}else{s.hype+=5;if(Math.random()<.45){s.scandal++;s.coachTrust-=8;addNews("Tus declaraciones molestaron al DT.")}else addNews("Tus declaraciones generan debate positivo.")}closeModal();clampAll();render()}

function openCareer(){let h=`<p class="sub">OVR ${ovr()}. Los clubes exigen nivel y afición.</p>`;Object.entries(CLUBS).forEach(([n,c])=>{if(n===s.club)return;let ok=ovr()>=c.ovr&&s.hype>=Math.max(0,c.ovr-45);h+=`<div class="item"><div style="flex:1"><b>${esc(n)}</b><div class="tiny">${esc(c.league)} · Req. OVR ${c.ovr}</div><div class="tiny">Sueldo semanal $${c.salary.toLocaleString("es-CO")}</div></div><button class="btn" ${ok?"":"disabled"} onclick="offer('${esc(n)}')">${ok?"Negociar":"Bloqueado"}</button></div>`});modal("Mercado de fichajes",h)}
function offer(n){let c=CLUBS[n];if(!c||ovr()<c.ovr||s.hype<Math.max(0,c.ovr-45))return;modal("Oferta de contrato",`<p><b>${esc(n)}</b> ofrece contrato.</p><div class="item"><span>Sueldo</span><b>$${c.salary.toLocaleString("es-CO")}</b></div><button class="choice" onclick="transfer('${esc(n)}',false)"><b>Aceptar oferta</b></button><button class="choice" onclick="transfer('${esc(n)}',true)"><b>Negociar +15% sueldo</b><span class="tiny">65% éxito</span></button>`)}
function transfer(n,neg){let c=CLUBS[n];if(neg&&Math.random()>.65){addNews(`${n} retiró la oferta de negociación.`);closeModal();return render()}s.club=n;s.salary=Math.round(c.salary*(neg?1.15:1));s.morale=clamp(s.morale+8);s.coachTrust=35;s.newCareer=false;addNews(`¡Fichaje confirmado por ${n}! Salario: $${s.salary.toLocaleString("es-CO")}.`);closeModal();render()}

function openShop(){modal("Tienda",`<p class="sub">Dinero: <b>$${s.money.toLocaleString("es-CO")}</b></p>${SHOP.map(i=>`<div class="item"><span style="font-size:24px">${i.icon}</span><div style="flex:1"><b>${esc(i.name)}</b><div class="tiny">${esc(i.desc)}</div></div><button class="btn" ${s.assets.includes(i.id)||s.money<i.price?"disabled":""} onclick="buy('${i.id}')">${s.assets.includes(i.id)?"Comprado":s.money<i.price?"-$"+(i.price-s.money).toLocaleString("es-CO"):"$"+i.price.toLocaleString("es-CO")}</button></div>`).join("")}`)}
function buy(id){let i=SHOP.find(x=>x.id===id);if(!i||s.assets.includes(id)||s.money<i.price)return;s.money-=i.price;s.assets.push(id);if(i.type==="hype")s.hype+=i.value;if(i.type==="fitness")s.fitness=clamp(s.fitness+i.value);if(i.type==="morale")s.morale=clamp(s.morale+i.value);addNews(`Compraste: ${i.name}.`);openShop();render()}

function openStyle(){modal("Identidad de jugador",`<label class="sub">Nombre</label><input class="field" id="nameInput" maxlength="24" value="${esc(s.name)}"><label class="sub">Dorsal (1–99)</label><input class="field" id="numInput" type="number" min="1" max="99" value="${s.number}"><button class="btn green" style="width:100%" onclick="saveStyle()">Guardar cambios</button><p class="sub">Tono de piel</p><div class="row">${["#f3c7a4","#c68642","#8d5524","#4a2c20"].map(c=>`<button class="btn secondary" style="width:48px;height:42px;background:${c}" onclick="skin('${c}')"></button>`).join("")}</div><p class="sub">Cabello</p><div class="row"><button class="btn secondary" onclick="hair('corto')">Corto</button><button class="btn secondary" onclick="hair('rubio')">Rubio</button><button class="btn secondary" onclick="hair('rapado')">Rapado</button></div>`)}
function saveStyle(){let n=$("nameInput").value.trim().slice(0,24),d=Number($("numInput").value);if(n)s.name=n;if(Number.isInteger(d)&&d>=1&&d<=99)s.number=d;closeModal();render();showToast("Identidad actualizada.")}
function skin(c){s.avatar.skin=c;render();openStyle()}function hair(h){s.avatar.hair=h;render();openStyle()}

function openHistory(){modal("Estadísticas de carrera",`<div class="item"><span>Partidos</span><b>${s.matches}</b></div><div class="item"><span>V / E / D</span><b>${s.wins} / ${s.draws} / ${s.losses}</b></div><div class="item"><span>Goles / Asistencias</span><b>${s.goals} / ${s.assists}</b></div><div class="item"><span>Confianza del DT</span><b>${Math.round(clamp(s.coachTrust))}/100</b></div><div class="item"><span>Relaciones</span><b>${Math.round(clamp(s.relationship))}/100</b></div><div class="item"><span>Polémicas</span><b>${s.scandal}</b></div><h3 class="section-title">Crónica</h3>${s.history.map(n=>`<div class="feed"><span class="tiny">T${n.season} · Sem. ${n.week}</span><br>${esc(n.msg)}</div>`).join("")||"<p class='sub'>Aún no hay historia.</p>"}<button class="btn secondary" onclick="exportSave()">Exportar partida</button> <button class="btn red" onclick="resetConfirm()">Nueva carrera</button>`)}
function exportSave(){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:"application/json"}));a.href=u;a.download="pro-football-save.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function resetConfirm(){modal("Atención",`<p>Se borrará tu progreso guardado. ¿Estás seguro?</p><button class="btn red" style="width:100%" onclick="resetGame()">Sí, empezar de cero</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="openHistory()">Cancelar</button>`)}
function resetGame(){s=fresh();save();render();addNews("Comienza una nueva historia. Demuestra tu talento.");closeModal()}
function clampAll(){s.energy=clamp(s.energy);s.fitness=clamp(s.fitness);s.morale=clamp(s.morale);s.hype=clamp(s.hype);s.coachTrust=clamp(s.coachTrust);s.relationship=clamp(s.relationship);s.money=Math.max(0,Math.floor(s.money))}

function endSeason(){
    let award=s.seasonGoals>=8?"Temporada goleadora: prima de $1.000.":s.wins>=8?"Buen año: prima de $500.":"Temporada discreta.";
    s.money+=s.seasonGoals>=8?1000:s.wins>=8?500:0;
    let recap=`Fin de temporada ${s.season}: ${s.seasonMatches} partidos, ${s.seasonGoals} goles, ${s.seasonAssists} asist. ${award}`;
    addNews(recap, true);
    s.season++;s.week=1;s.day=1;s.seasonGoals=0;s.seasonAssists=0;s.seasonMatches=0;s.wins=0;s.losses=0;s.draws=0;s.energy=100;s.fitness=85;s.morale=75;s.playedToday=false;
    if(s.scandal>=3){s.coachTrust-=10;addNews("Polémicas afectaron tu evaluación del DT.")}
    s.scandal=Math.max(0,s.scandal-1);clampAll();render();
    modal("Cierre de temporada",`<p>${esc(recap)}</p><p>Arranca la T${s.season}. Conservas tu club, atributos y dinero.</p><button class="btn green" style="width:100%" onclick="closeModal()">Empezar temporada</button>`)
}

if(!load()){s=fresh();save()}render();if(!s.history.length)addNews("Carrera nueva iniciada.");
</script>
</body>
