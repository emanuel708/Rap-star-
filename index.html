function shop(){md("🛍️ Tienda",ITEMS.map(x=>`<div class="row"><div>${x[4]} <b>${x[0]}</b><div class="sub">$${fm(x[1])} · ${x[2]==="en"?"+8 energía al descansar":x[2]==="mo"?"+"+x[3]+" moral":"+"+x[3]+" fama"}</div></div><button class="btn" ${s.it.includes(x[0])||s.money<x[1]?"disabled":""} onclick="buy('${x[0]}')">${s.it.includes(x[0])?"✔":"Comprar"}</button></div>`).join(""))}
function buy(n){let x=ITEMS.find(i=>i[0]===n);if(s.money<x[1]||s.it.includes(n))return;s.money-=x[1];s.it.push(n);if(x[2]==="fa")s.fa=cl(s.fa+x[3]);if(x[2]==="mo")s.mo=cl(s.mo+x[3]);post(nm(s.fr[1]),"¡"+s.n+" se compró "+x[0]+"! "+x[4],"f");save();shop()}
function spons(){md("🤝 Marcas",`<div class="sub">Contratos de 26 semanas.</div>`+SP.map(x=>{let a=s.sp.find(y=>y.n===x[0]),ok=ovr()>=x[1]&&s.fa>=x[1]-15;return`<div class="row"><div><b>${x[0]}</b><div class="sub">+$${fm(x[2])}/sem · Req. OVR ${x[1]}</div></div>${a?'<span class="pill">Activo</span>':`<button class="btn" ${ok?"":"disabled"} onclick="signSp('${x[0]}')">Firmar</button>`}</div>`}).join(""))}
function signSp(n){let x=SP.find(i=>i[0]===n);s.sp.push({n,w:x[2],end:(s.se-1)*20+s.wk+26});s.money+=x[2]*4;post(n+" (oficial)","Nuevo embajador: "+nm(s)+" 🤝","c");news("Firmaste con "+n);save();spons()}
/* ===== Partido ===== */
const AT={DC:[["Definir ante el portero","sho","goal"],["Cabezazo al área","phy","goal"],["Pase al hueco","pas","assist"],["Carrera al espacio","pac","goal"]],_:[["Disparo de media distancia","sho","goal"],["Pase filtrado","pas","assist"],["Regate al defensor","dri","goal"],["Centro al área","pas","assist"]]},DF=[["Barrer limpio","def","stop"],["Despejar de cabeza","phy","stop"],["Cortar el pase","def","stop"],["Cerrar el espacio","pac","stop"]];
let m=null;
function playWeek(){if(s.en<15)tg("⚡ Poca energía: rendirás menos");if(s.trust<8){s.mo=cl(s.mo-4);news("El técnico no te convocó.");return endWeek(null)}
let pool=isDef()?[...DF,...AT._]:s.pos==="DC"?[...AT.DC,...AT._]:AT._,n=s.trust<22?2:4,ev=[];for(let i=0;i<n;i++){let a=isDef()&&i<3?DF:pool,o=[...a].sort(()=>Math.random()-.5).slice(0,2);ev.push(o)}
m={i:0,g:0,c:0,ev,n:ev.length,opp:s.opp,oo:CL[s.opp].o,r:6};play("")}
function play(r){let e=m.ev[m.i];md(`⚽ ${esc(s.club)} vs ${esc(m.opp)} · ${m.i+1}/${m.n}`,`${r?`<div class="card" style="border-color:var(--g)"><b>${esc(r)}</b></div>`:""}<div class="score">${m.g} - ${m.c}</div><p class="sub" style="text-align:center">Min ${15+Math.round(m.i*75/m.n)} · ${R(["Balón dividido","Se abre el espacio","Presión alta","Jugada clave"])}</p>${e.map((o,j)=>`<button class="ch" onclick="res(${j})"><b>${o[0]}</b><small>Depende de ${SN[o[1]]}</small></button>`).join("")}`)}
function res(j){let o=m.ev[m.i][j],t=cur().o,ch=cl(20+s.st[o[1]]*.55+ovr()*.15+s.mo*.05+(t-m.oo)/4-(s.en<30?12:0)+(s.trust>60?4:0),12,92),d;
if(Math.random()*100<ch){m.r+=.5;s.trust=cl(s.trust+2);if(o[2]==="goal"){m.g++;s.gl++;s.fa=cl(s.fa+3);d="⚽ ¡GOOOL!";burst("⚽ ¡GOOOL!",CEL[s.cu.ce])}else if(o[2]==="assist"){m.g++;s.as++;s.fa=cl(s.fa+2);d="🎯 ¡Asistencia y gol!";burst("🎯 ¡ASISTENCIA!")}else{s.fa=cl(s.fa+1);d="🧱 ¡Gran intervención!"}}else{m.r-=.5;s.trust=cl(s.trust-1);if(Math.random()<(o[2]==="stop"?.55:.25)){m.c++;d="❌ Fallaste y el rival marcó."}else d="⚠️ No salió la acción."}
s.en=cl(s.en-6);m.i++;if(m.i<m.n)return play(d);let g=t-m.oo;if(Math.random()<cl(.3+g/80,.05,.8))m.g++;if(Math.random()<cl(.3-g/80,.05,.8))m.c++;fin(d)}
function fin(d){let w=m.g>m.c,e=m.g===m.c,x=m.g+"-"+m.c;s.mp++;if(w){s.w++;s.money+=150;s.fa=cl(s.fa+3);s.trust=cl(s.trust+3)}else if(e)s.d++;else s.lo++;s.mo=cl(s.mo+(w?8:e?2:-5));if(!m.c&&isDef()){s.fa=cl(s.fa+3);d+=" Portería a cero."}
let T=s.tb[s.club],O=s.tb[m.opp];T.j++;O.j++;T.gf+=m.g;T.gc+=m.c;O.gf+=m.c;O.gc+=m.g;T.p+=w?3:e?1:0;O.p+=w?0:e?1:3;news(`${s.club} ${x} ${m.opp}. ${w?"Victoria":e?"Empate":"Derrota"}.`);post("Prensa deportiva",`${s.club} ${x} ${m.opp}. ${nm(s)} ${m.g>m.c?"fue clave":"no pudo evitarlo"}.`,"m");
let rs=m;m=null;endWeek(rs);if(s.age<38)md("Final",`<div class="score">${x}</div><p style="text-align:center">${w?"🎉 ¡Victoria!":e?"🤝 Empate":"😞 Derrota"}</p><p class="sub" style="text-align:center">${esc(d)}</p><p style="text-align:center">➡️ <b>Semana ${s.wk}</b> · Próximo rival: ${esc(s.opp)}</p><button class="play" onclick="cm()">Continuar</button>`)}
function sim(a,b){let g=cl(1.3+(CL[a].o-CL[b].o)/25,.3,3),h=cl(1.3-(CL[a].o-CL[b].o)/25,.3,3),p=x=>{let k=0,L=Math.exp(-x),q=1,u=Math.random();for(let i=0;i<7;i++){q*=i?x/i:1;if(u>(k+=L*q))continue;return i}return 6};return[p(g),p(h)]}
function endWeek(rs){let lg=cur().g,o=LG[lg].filter(c=>c!==s.club&&c!==s.opp).sort(()=>Math.random()-.5);for(let i=0;i+1<o.length;i+=2){let[a,b]=sim(o[i],o[i+1]),A=s.tb[o[i]],B=s.tb[o[i+1]];A.j++;B.j++;A.gf+=a;A.gc+=b;B.gf+=b;B.gc+=a;if(a>b)A.p+=3;else if(a<b)B.p+=3;else{A.p++;B.p++}}
if(!rs){s.tb[s.club].j++}
s.money+=s.sal+s.sp.reduce((n,c)=>n+c.w,0);s.money=Math.max(0,s.money-Math.round(s.sal*.4)-s.it.length*60);s.en=cl(s.en+20);s.did={};s.fr.forEach(f=>f.bond=cl(f.bond-1.5));if(s.pa){s.pa.bond=cl(s.pa.bond-2.5);if(s.pa.bond<8){news(nm(s.pa)+" terminó la relación.");post(nm(s.pa),"Hay ciclos que se cierran. Mucho éxito.","p");s.pa=null;s.mar=0;s.mo=cl(s.mo-10)}}
let a=(s.se-1)*20+s.wk;s.sp=s.sp.filter(c=>{if(a>=c.end){s.money+=c.w*8;news("Contrato con "+c.n+" terminado. Pago final.");return false}return true});
let f=R(s.fr);if(Math.random()<.7)post(nm(f),R(["Domingo de asado con la familia 🍖","Nuevo gym, nuevo yo 💪","Estudiando… 😩","Viaje de fin de semana ✈️","Vi el partido de mi parcero "+s.n+" ⚽","Gran concierto anoche 🎶"]),"f");if(s.pa&&Math.random()<.5)post(nm(s.pa),R(["Un día con "+s.n+" vale por mil ❤️","Mirando el partido de "+s.n+" 📺","Orgullosa de ti, "+s.n+" 💫"]),"p");if(Math.random()<.4)post(nm(R(s.sq)),R(["Gran trabajo hoy, equipo 💙","A seguir sumando 🔥","Entrenamiento duro 🏋️"]),"t");
if(s.foc){let k=s.foc;if(Math.random()<cl(.6-s.st[k]/200+(s.part?.12:0),.1,.8)){s.st[k]=cl(s.st[k]+1,0,99);news("🎯 Tu enfoque semanal mejoró "+SN[k])}s.en=cl(s.en-4)}s.en=cl(s.en+10);s.part=0;s.day=1;s.dd=0;s.dact=rn(0,1);s.wk++;if(s.wk>20)endSeason();else{newOpp()}save();render()}
function endSeason(){let t=Object.entries(s.tb).sort((a,b)=>b[1].p-a[1].p),pos=t.findIndex(x=>x[0]===s.club)+1;if(pos===1&&t.length>1){s.ti++;s.money+=5000;s.fa=cl(s.fa+10);news("🏆 ¡Campeón de "+cur().g+"!");post(s.club+" (oficial)","🏆 ¡CAMPEONES! Gracias afición.","c");setTimeout(()=>burst("🏆 ¡CAMPEÓN!"),300)}else news("Terminaste "+pos+"º en "+cur().g);
if(s.gl>=15*s.se){s.money+=2000}s.se++;s.wk=1;s.age++;if(s.age>=31){s.st.pac=cl(s.st.pac-2);s.st.phy=cl(s.st.phy-1)}else if(s.age<=24)s.st.pac=cl(s.st.pac+1);s.ctr--;
if(s.ctr<=0&&s.club!=="Club de Barrio"){if(s.trust<25){news(s.club+" no te renovó.");s.club="Club de Barrio";s.sal=CL[s.club].sal;genSq()}else{s.sal=Math.round(s.sal*1.1);news("Renovaste con "+s.club)}s.ctr=2}
if(ovr()>=72&&s.fa>=55){s.sg++;news("🌍 ¡Convocado a la selección!");post("Federación","Convocatoria: "+nm(s),"c")}
s.world.forEach(p=>{p.o=cl(p.o+rn(-1,1),50,94)});initTb();genWorld.call&&0;if(s.age>=38)return md("🏁 Retiro",`<p>Te retiras a los ${s.age} años.</p><div class="row"><span>Partidos</span><b>${s.mp}</b></div><div class="row"><span>Goles</span><b>${s.gl}</b></div><div class="row"><span>Títulos</span><b>${s.ti}</b></div><button class="play" onclick="s=null;cm();setup()">Nueva carrera</button>`)}
window.onerror=m=>tg("⚠️ "+m);(function(){try{let p=JSON.parse(localStorage.getItem("pfs14"));if(p&&p.v===14){s=p;s.cu=Object.assign({hs:1,hc:HC[1],bd:0,ey:EY[0],tt:[]},s.cu);s.cu.ac%=ACC.length;s.day=s.day||1;s.dd=s.dd||0;s.dact=s.dact||0;render()}else setup()}catch(e){setup()}})();
</script></body></html>
