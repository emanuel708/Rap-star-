<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b132b">
<title>Pro Football Star: Evolution V7</title>
<style>
:root {
  --bg: #070d1a; --p: #111c38; --p2: #1a284f; --line: #2a3d70; --txt: #f4f6fb; 
  --muted: #94a3b8; --green: #10b981; --blue: #3b82f6; --pink: #ec4899;
  --red: #ef4444; --gold: #f59e0b;
  --grad: linear-gradient(135deg, #3b82f6, #10b981);
  --grad-match: linear-gradient(135deg, #f59e0b, #ef4444);
}
* { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { margin: 0; background: var(--bg); color: var(--txt); padding-bottom: 80px; user-select: none; font-size: 14px; }
.app { max-width: 480px; margin: auto; padding: 12px; }

/* Header */
.header { background: var(--p); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.header-col { display: flex; flex-direction: column; gap: 4px; }
.val-pill { background: #050a14; padding: 4px 8px; border-radius: 6px; font-weight: bold; border: 1px solid var(--line); font-size: 12px; display: flex; align-items: center; gap: 5px; }

/* Dashboard */
.card { background: var(--p); border: 1px solid var(--line); border-radius: 16px; padding: 15px; margin-bottom: 12px; position: relative; }
.dashboard-grid { display: grid; grid-template-columns: 50px 1fr 50px; gap: 10px; align-items: center; }
.bars-col { display: flex; flex-direction: column; gap: 10px; }
.v-bar-wrap { text-align: center; font-size: 9px; color: var(--muted); font-weight: bold; }
.v-bar { width: 12px; height: 90px; background: #050a14; border-radius: 6px; margin: 4px auto 0; border: 1px solid var(--line); display: flex; align-items: flex-end; overflow: hidden; }
.v-fill { width: 100%; transition: height 0.3s; }

/* Avatar Box */
.avatar-container { display: flex; flex-direction: column; align-items: center; position: relative; }
.avatar-box { width: 130px; height: 150px; background: radial-gradient(circle, #2a3d70, #050a14); border: 2px solid var(--line); border-radius: 16px; overflow: hidden; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
.injury-overlay { position: absolute; inset: 0; background: rgba(239, 68, 68, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; text-align: center; z-index: 10; backdrop-filter: blur(2px); color: white; }
.badges { position: absolute; top: 5px; right: 5px; display: flex; flex-direction: column; gap: 4px; }
.badge { background: rgba(0,0,0,0.8); font-size: 10px; padding: 2px 5px; border-radius: 4px; border: 1px solid var(--gold); color: var(--gold); font-weight: bold; }
.badge.assist { border-color: var(--blue); color: var(--blue); }

/* Actions */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
.btn-action { background: var(--p2); border: 1px solid var(--line); border-radius: 12px; padding: 15px; color: #fff; font-weight: 800; text-align: left; font-size: 13px; display: flex; flex-direction: column; gap: 5px; cursor: pointer; transition: 0.2s; }
.btn-action span { font-size: 20px; }
.btn-action:active { transform: scale(0.96); }
.btn-action:disabled { opacity: 0.4; pointer-events: none; filter: grayscale(1); }
.btn-primary { background: var(--grad); border: none; }
.btn-match { background: var(--grad-match); border: none; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }

/* Nav */
.nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5, 9, 20, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 10px 0 20px 0; z-index: 100; }
.nav-item { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 20px; cursor: pointer; }
.nav-item span { font-size: 10px; font-weight: bold; text-transform: uppercase; }

/* Modals */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(5px); }
.modal { background: var(--bg); border: 1px solid var(--line); border-radius: 24px 24px 0 0; width: 100%; max-width: 480px; max-height: 85vh; padding: 20px; overflow-y: auto; animation: slideUp 0.3s ease-out; display: flex; flex-direction: column; gap: 15px; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 10px; }
.close-btn { background: var(--p2); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-weight: bold; cursor: pointer; }
.list-item { background: var(--p); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
.btn-sm { background: var(--blue); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }
.btn-sm:disabled { background: var(--line); color: var(--muted); }

/* Style Customizer */
.cust-grid { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.cust-item { width: 50px; height: 50px; flex-shrink: 0; border-radius: 10px; border: 2px solid var(--line); background: var(--p2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<main class="app">
  <div class="header">
    <div class="header-col">
      <div style="color:var(--gold); font-weight:900; font-size:15px;" id="calendarTxt">Día 1 · Semana 1</div>
      <div style="color:var(--muted); font-size:11px;" id="seasonTxt">Temporada 1</div>
