<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>Pro Football Star V10 - Marcas y economía</title>
<style>
:root{--bg:#07101f;--p:#101d35;--p2:#172847;--line:#2a416b;--t:#f3f7ff;--m:#9eafc9;--g:#23d18b;--gold:#ffc857;--red:#ff647c;--blue:#66a8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#102448,#07101f 58%);color:var(--t);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(85px + env(safe-area-inset-bottom))}.app{max-width:520px;margin:auto;padding:12px}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}.top,.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.eyebrow,.tiny,.sub{color:var(--m);font-size:11px;line-height:1.5}.money{color:var(--gold);font-weight:900}.hero{display:grid;grid-template-columns:90px 1fr;gap:13px;align-items:center}.avatar{width:90px;height:108px;border-radius:14px;display:grid;place-items:center;font-size:58px;background:#1b3156;border:1px solid #45608e}.name{font-size:21px;font-weight:900}.badge,.pill{display:inline-block;background:#091426;border:1px solid var(--line);border-radius:99px;padding:5px 8px;font-size:10px;margin:3px 3px 0 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.stat{background:#091426;border:1px solid #243959;border-radius:10px;padding:8px 4px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:9px;color:var(--m)}.meter{height:6px;background:#091426;border-radius:9px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--g)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action{min-height:76px;text-align:left;background:var(--p2);color:var(--t);border:1px solid var(--line);border-radius:13px;padding:12px;font-weight:800}.action strong{display:block;font-size:22px}.primary{background:linear-gradient(135deg,#1677ef,#0ab987);border:0}.matchbtn{background:linear-gradient(135deg,#a65b13,#cf344f);border:0}.action:disabled,.btn:disabled{opacity:.35}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.section-title{font-size:16px;font-weight:900;margin:0 0 10px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:8px 4px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;background:#050c19f5;border-top:1px solid var(--line)}.nav button{background:none;border:0;color:var(--m);font-size:10px;font-weight:800;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:55px}.nav .ico{font-size:20px}.overlay{display:none;position:fixed;inset:0;z-index:10;background:#020711dd;align-items:flex-end;justify-content:center}.modal{width:100%;max-width:520px;max-height:88dvh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 15px calc(22px + env(safe-area-inset-bottom))}.modalhead{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:900;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}.close{border:0;border-radius:50%;background:var(--p2);color:white;width:34px;height:34px}.item{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{background:var(--blue);color:#061225;border:0;border-radius:9px;padding:10px 12px;font-weight:900}.btn.secondary{background:var(--p2);color:var(--t);border:1px solid var(--line)}.btn.green{background:var(--g)}.btn.red{background:var(--red)}.choice{display:block;width:100%;text-align:left;background:var(--p2);border:1px solid var(--line);border-radius:12px;color:var(--t);padding:14px;margin-top:9px;line-height:1.4}.choice b{display:block;margin-bottom:4px}.feed{border-left:3px solid var(--gold);padding:8px 0 8px 12px;margin:10px 0;line-height:1.45}.field{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#081 </style></head><body><main class="app">
<header class="top"><div><div class="eyebrow" id="dateLabel"></div><div style="font-weight:900;margin-top:4px" id="clubLabel"></div><div class="tiny" id="seasonLabel"></div></div><div style="text-align:right"><div class="money">💰 $<span id="money"></span></div><div class="pill">⚡ <span id="energy"></span>% energía</div></div></header>
<section class="card"><div class="hero"><div class="avatar" id="avatar">⚽</div><div><div class="eyebrow">TU CARRERA</div><div class="name" id="nameLabel"></div><div class="sub" id="playerMeta"></div><span class="badge" id="ovrBadge"></span><span class="badge" id="moodBadge"></span><div class="sub" id="injuryText"></div></div></div><div class="stats" id="stats"></div></section>
<section class="card"><div class="row"><h2 class="section-title">Tu semana</h2><span class="pill" id="nextEvent"></span></div><div class="meter"><i id="energyBar"></i></div><div class="sub" id="objective" style="margin-top:9px"></div></section>
<section class="actions"><button class="action matchbtn" id="matchBtn" onclick="startMatch()"><strong>⚽</strong>JUGAR PARTIDO<small class="sub" id="matchSub"></small></button><button class="action primary" id="trainBtn" onclick="openTraining()"><strong>🏃</strong>ENTRENAR<small class="sub">Mejora habilidades</small></button><button class="action" onclick="openLife()"><strong>📱</strong>VIDA PERSONAL<small class="sub">Familia, redes y descanso</small></button><button class="action" onclick="advanceDay()"><strong>⏳</strong>AVANZAR DÍA<small class="sub">Recupera y sigue la historia</small></button></section>

<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal"><div class="modalhead"><span id="modalTitle"></span><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
"use strict";
const DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const CLUBS={"Club de Barrio":{ovr:0,league:"Amateur",salary:100,color:"#23d18b"},"Envigado FC":{ovr:52,league:"Colombia",salary:650,color:"#f97316"},"Deportivo Cali":{ovr:58,league:"Colombia",salary:1000,color:"#22c55e"},"Atlético Nacional":{ovr:64,league:"Colombia",salary:1800,color:"#22c55e"},"Millonarios":{ovr:65,league:"Colombia",salary:1800,color:"#60a5fa"},"Boca Juniors":{ovr:70,league:"Argentina",salary:3000,color:"#eab308"},"River Plate":{ovr:72,league:"Argentina",salary:3500,color:"#f8fafc"},"FC Barcelona":{ovr:84,league:"España",salary:50000,color:"#60a5fa"},"Real Madrid":{ovr:87,league:"España",salary:75000,color:"#f8fafc"},"Manchester City":{ovr:88,league:"Inglaterra",salary:85000,color:"#38bdf8"}};
const SHOP=[{id:"console",name:"Consola",desc:"+3 moral al descansar",price:800,type:"morale",value:3,icon:"🎮"},{id:"motorbike",name:"Moto clásica",desc:"+5 afición al comprar",price:2500,type:"hype",value:5,icon:"🏍️"},{id:"nutrition",name:"Nutricionista",desc:"+5 energía al descansar",price:6000,type:"energy",value:5,icon:"🥗"},{id:"car",name:"Camioneta",desc:"+10 afición al comprar",price:18000,type:"hype",value:10,icon:"🚙"},{id:"home",name:"Casa mejorada",desc:"+5 energía y moral al descansar",price:30000,type:"home",value:5,icon:"🏡"},{id:"boots",name:"Botas profesionales",desc:"+5 forma al comprarlas",price:4500,type:"fitness",value:5,icon:"👟"},{id:"car_upgrade",name:"Auto deportivo",desc:"+12 afición al comprar",price:42000,type:"hype",value:12,icon:"🏎️"},{id:"phone",name:"Teléfono premium",desc:"+4 afición al comprar",price:3200,type:"hype",value:4,icon:"📱"},{id:"apartment",name:"Apartamento de lujo",desc:"+5 moral al comprar",price:65000,type:"morale",value:5,icon:"🏙️"},{id:"watch",name:"Reloj de lujo",desc:"+6 afición al comprar",price:15000,type:"hype",value:6,icon:"⌚"},{id:"hoodie",name:"Sudadera exclusiva",desc:"+3 afición al comprar",price:450,type:"hype",value:3,icon:"🧥"},{id:"taller",name:"Taller automotriz",desc:"Ingreso pasivo de $500 al cierre de mes",price:15000,type:"business",value:500,icon:"🔧"},{id:"private_jet",name:"Vuelo privado",desc:"+15 afición al comprar",price:250000,type:"hype",value:15,icon:"✈️"}];
const fresh=()=>({version:10,name:"Promesa",number:9,day:1,week:1,season:1,money:500,energy:100,fitness:80,morale:80,hype:10,stats:{pac:50,sho:50,pas:50,dri:50,def:35,phy:50},club:"Club de Barrio",salary:100,injury:0,assets:[],goals:0,assists:0,matches:0,wins:0,losses:0,draws:0,seasonGoals:0,seasonAssists:0,seasonMatches:0,relationship:55,coachTrust:35,scandal:0,playedToday:false,firstTrial:false,offerSeen:false,history:[],matchLog:[],socialPosts:[],partner:"",avatar:{skin:"#b77950",hair:"corto"},storyFlags:{},training:0,pendingEvent:null,sponsors:[],sponsorCooldown:0,brandIncome:0,expenses:0,agentLevel:0});
let s=fresh(),match=null;const $=id=>document.getElementById(id),clamp=(n,min=0,max=100)=>Math.max(min,Math.min(max,Number(n)||0)),esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){try{localStorage.setItem("proFootballStarV10",JSON.stringify(s))}catch(e){}}
function load(){try{let p=JSON.parse(localStorage.getItem("proFootballStarV10"));if(!p||p.version!==10)return false;s={...fresh(),...p,stats:{...fresh().stats,...p.stats},avatar:{...fresh().avatar,...p.avatar},assets:Array.isArray(p.assets)?p.assets:[],history:Array.isArray(p.history)?p.history:[],matchLog:Array.isArray(p.matchLog)?p.matchLog:[],socialPosts:Array.isArray(p.socialPosts)?p.socialPosts:[]};return true}catch(e){return false}}
function ovr(){return Math.round(s.stats.pac*.15+s.stats.sho*.22+s.stats.pas*.16+s.stats.dri*.2+s.stats.def*.1+s.stats.phy*.17)}
function addNews(msg){s.history.unshift({week:s.week,season:s.season,msg});s.history=s.history.slice(0,35);$("news").innerHTML=s.history.slice(0,3).map(n=>`<div class="feed"><span class="tiny">T${n.season} · S${n.week}</span><br>${esc(n.msg)}</div>`).join("");save()}
function modal(title,html){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("overlay").style.display="flex"}
function closeModal(){$("overlay").style.display="none"}$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeModal()});
function render(){s.energy=clamp(s.energy);s.fitness=clamp(s.fitness);s.morale=clamp(s.morale);s.hype=clamp(s.hype);$("dateLabel").textContent=`${DAYS[s.day-1]||"Lunes"} · Semana ${s.week}`;$("clubLabel").textContent=s.club;$("seasonLabel").textContent=`Temporada ${s.season} · ${s.club==="Club de Barrio"?"Promesa":"Profesional"}`;$("money").textContent=Math.floor(s.money).toLocaleString("es-CO");$("energy").textContent=Math.round(s.energy);$("nameLabel").textContent=s.name;$("playerMeta").textContent=`Delantero · #${s.number} · ${CLUBS[s.club]?.league||"Profesional"}`;$("ovrBadge").textContent=`OVR ${ovr()}`;$("moodBadge").textContent=`Moral ${Math.round(s.morale)}`;$("injuryText").textContent=s.injury>0?`🩹 Lesionado: ${s.injury} día(s)`:"";$("energyBar").style.width=`${s.energy}%`;const stats=[["RIT",s.stats.pac],["TIR",s.stats.sho],["PAS",s.stats.pas],["REG",s.stats.dri],["DEF",s.stats.def],["FIS",s.stats.phy],["FORMA",s.fitness],["FANS",s.hype]];$("stats").innerHTML=stats.map(([n,v])=>`<div class="stat"><b>${Math.round(v)}</b><span>${n}</span></div>`).join("");$("avatar").style.background=`linear-gradient(145deg,${CLUBS[s.club]?.color||"#334155"},#101d35)`;$("avatar").textContent=s.injury?"🩹":s.avatar.hair==="rubio"?"👱🏽":"🧑🏽‍🦱";const md=s.day===6||s.day===7;$("matchBtn").disabled=!md||s.injury>0||s.playedToday;$("matchSub").textContent=s.injury?`Lesión: ${s.injury} días`:s.playedToday?"Partido jugado":s.playedToday?"Partido semanal jugado":md?"Un partido esta semana (sábado o domingo)":"Disponible sábado y domingo";$("trainBtn").disabled=md||s.injury>0;$("nextEvent").textContent=md?"Día de partido":s.day===5?"Convocatoria":"Entrenamiento";$("objective").textContent=!s.firstTrial?"Objetivo: supera la primera prueba y gana tu convocatoria.":`Objetivo: mejora OVR (${ovr()}) y reputación (${Math.round(s.hype)}).`;if(!s.history.length)$("news").innerHTML='<div class="feed">El entrenador quiere conocerte. Demuestra que mereces una oportunidad.</div>';save()}
function advanceDay(){
 if(s.injury>0){s.injury--;s.energy+=10}else{s.energy+=15+(s.assets.includes("nutrition")?5:0)+(s.assets.includes("home")?5:0);s.fitness+=5}
 if(s.assets.includes("console"))s.morale+=3;if(s.assets.includes("home"))s.morale+=5;s.morale+=2;s.day++;
 if(s.day>7){s.day=1;s.playedToday=false;s.week++;s.money+=s.salary;if(s.sponsors&&s.sponsors.length){s.sponsors.forEach(c=>{s.money+=c.weekly;s.brandIncome+=c.weekly;});}if(s.week%4===0){let baseExpense= Math.max(100,Math.round(s.salary*0.22))+150;s.money=Math.max(0,s.money-baseExpense);s.expenses+=baseExpense;let note=`Pagaste $${baseExpense.toLocaleString("es-CO")} en vivienda, transporte, alimentación y representante.`;if(s.assets.includes("taller")){s.money+=500;note+=" Tu taller generó $500.";}addNews(note);}if(s.week>52){endSeason();return}}
 s.energy=clamp(s.energy);s.fitness=clamp(s.fitness);s.morale=clamp(s.morale);
 if(s.day===5&&!s.firstTrial)addNews("El entrenador anunció una prueba para el fin de semana. Llega en buena forma.");
 if(s.week>=2&&!s.offerSeen&&ovr()>=52&&s.matches>=2){s.offerSeen=true;addNews("Un ojeador de Envigado pregunta por ti. Revisa el mercado de fichajes.")}
 render();
 // El evento aparece automáticamente al avanzar el día; nunca se repite en el mismo día.
 if(!s.pendingEvent && Math.random()<0.58) setTimeout(()=>triggerLifeEvent(),120);
}
function openTraining(){let items=[["pac","🏃","Ritmo"],["sho","🎯","Tiro"],["pas","👟","Pases"],["dri","🪄","Regate"],["def","🛡️","Defensa"],["phy","🏋️","Físico"]];modal("Centro de entrenamiento",`<p class="sub">Entrenar consume 25 de energía y avanza un día.</p>${items.map(([k,i,n])=>`<div class="item"><div><b>${i} ${n}</b><div class="tiny">Actual: ${s.stats[k]}</div></div><button class="btn" onclick="train('${k}')">Entrenar</button></div>`).join("")}`)}
function train(k){if(s.energy<25){alert("No tienes energía suficiente. Descansa primero.");return}s.energy-=25;s.fitness-=2;s.training++;if(Math.random()<.92-s.stats[k]/140){s.stats[k]=clamp(s.stats[k]+1,0,99);s.coachTrust=clamp(s.coachTrust+1);addNews(`Buen entrenamiento: mejoraste ${({pac:"ritmo",sho:"tiro",pas:"pases",dri:"regate",def:"defensa",phy:"físico"})[k]}.`)}else addNews("Entrenaste con intensidad, pero esta vez no hubo mejora técnica.");if(s.energy<35&&Math.random()<.08){s.injury=2+Math.floor(Math.random()*4);addNews(`Sobrecarga: necesitarás ${s.injury} días de recuperación.`)}closeModal();advanceDay()}
const EVENTS=[{text:"Recibes dentro del área. El portero achica y tu compañero aparece libre.",a:["Definir al primer palo","sho","goal"],b:["Asistir al compañero","pas","assist"]},{text:"Un defensor te cierra contra la banda. La grada espera algo especial.",a:["Intentar un regate","dri","show"],b:["Proteger y tocar atrás","phy","safe"]},{text:"Robo en mitad de cancha: hay espacio para la contra.",a:["Picar al espacio","pac","run"],b:["Cambiar el juego con un pase","pas","team"]},{text:"Tiro libre cerca del área. El capitán te ofrece patearlo.",a:["Pedir la responsabilidad","sho","goal"],b:["Dejarlo al especialista","pas","team"]},{text:"El rival presiona alto y estás rodeado.",a:["Salir jugando con técnica","dri","show"],b:["Jugar simple y asegurar","pas","safe"]}];
function startMatch(){if(!(s.day===6||s.day===7)||s.injury||s.playedToday)return;if(s.energy<20&&!confirm("Tienes poca energía. ¿Jugar de todos modos?"))return;match={step:0,score:0,against:0,rating:6,events:[...EVENTS].sort(()=>Math.random()-.5).slice(0,3),opponent:["Atlético del Sur","Unión Central","Deportivo Montaña","Real del Valle"][Math.floor(Math.random()*4)]};showPlay()}
function showPlay(lastResult=""){let e=match.events[match.step];modal(`⚽ Partido · Jugada ${match.step+1}/3`,`${lastResult?`<div class="item" style="border-color:var(--gold)"><b>${esc(lastResult)}</b></div>`:""}<div class="pill">${esc(s.club)} vs ${esc(match.opponent)}</div><div class="score">${match.score} - ${match.against}</div><p class="sub" style="text-align:center">Minuto ${18+match.step*29} · Nota ${match.rating.toFixed(1)}</p><p style="font-size:16px;line-height:1.5">${e.text}</p><button class="choice" onclick="resolvePlay(0)"><b>${e.a[0]}</b><span class="tiny">Atributo: ${e.a[1].toUpperCase()}</span></button><button class="choice" onclick="resolvePlay(1)"><b>${e.b[0]}</b><span class="tiny">Atributo: ${e.b[1].toUpperCase()}</span></button>`)}
function resolvePlay(which){let e=match.events[match.step],o=which?e.b:e.a,stat=s.stats[o[1]]||50,ch=clamp(18+stat*.62+ovr()*.18+s.fitness*.08+s.morale*.05-s.scandal*3,15,92);if(s.energy<30)ch-=12;let ok=Math.random()*100<ch,detail="",actionResult="";if(ok){match.rating+=.45;s.coachTrust=clamp(s.coachTrust+2);if(o[2]==="goal"||(o[2]==="run"&&Math.random()<.28)){match.score++;s.goals++;s.seasonGoals++;s.hype+=4;s.morale+=4;detail="⚽ ¡GOOOL! La jugada terminó en gol.";actionResult="Gol marcado.";}else if(o[2]==="assist"||(o[2]==="team"&&Math.random()<.25)){s.assists++;s.seasonAssists++;s.hype+=2;detail="🎯 ¡ASISTENCIA! Tu pase dejó a un compañero en posición de marcar.";actionResult="Pase decisivo y asistencia.";}else{detail=o[2]==="safe"?"✅ Pase completado: conservaste la posesión.":"✅ ¡Buena decisión! La acción salió bien.";actionResult="Acción completada.";} }else{match.rating-=.45;s.fitness-=3;s.coachTrust=clamp(s.coachTrust-1);if(Math.random()<.23){match.against++;detail="❌ Pérdida peligrosa: el rival aprovechó y marcó.";actionResult="Pérdida de balón; gol del rival.";}else{detail="⚠️ No salió la jugada: falló el pase o la acción elegida.";actionResult="Acción fallida.";}if(o[2]==="goal"){s.morale-=4;detail+=" La prensa cuestiona tu decisión.";} }match.actions=match.actions||[];match.actions.push({minute:18+match.step*29,choice:o[0],result:actionResult,score:match.score+"-"+match.against});addNews(detail);s.energy=clamp(s.energy-12);match.step++;if(match.step<3){showPlay(detail);}else{finishMatch(detail);}}
function finishMatch(lastResult=""){let win=match.score>match.against,draw=match.score===match.against;s.matches++;s.seasonMatches++;s.playedToday=true;if(win){s.wins++;s.money+=150;s.hype+=5;s.coachTrust+=3}else if(draw){s.draws++;s.money+=60}else{s.losses++;s.coachTrust-=2}s.morale+=win?8:draw?2:-5;let result=`${match.score}-${match.against}`,summary=`Final: ${s.club} ${result} ${match.opponent}. Nota ${Math.max(1,Math.min(10,match.rating)).toFixed(1)}. ${win?"Victoria":draw?"Empate":"Derrota"}.`;let actionReport=(match.actions||[]).map(a=>`<div class="item"><div><b>Min. ${a.minute}: ${esc(a.choice)}</b><div class="tiny">${esc(a.result)} · Marcador ${esc(a.score)}</div></div></div>`).join("");s.matchLog=s.matchLog||[];s.matchLog.unshift({summary,week:s.week,season:s.season,actions:match.actions||[]});s.matchLog=s.matchLog.slice(0,25);match=null;if(!s.firstTrial){s.firstTrial=true;s.coachTrust+=8;s.newCareer=false;addNews("¡Superaste la primera prueba! El club te registra en la plantilla amateur.")}addNews(summary);render();modal("Final del partido",`<div class="score">${esc(result)}</div><p style="text-align:center">${esc(summary)}</p><h3 class="section-title">Tus decisiones y sus resultados</h3>${actionReport}<button class="btn green" style="width:100%" onclick="closeModal()">Continuar carrera</button>`)}
const SOCIAL_FEED=[
{who:"Mateo Ríos · Amigo",app:"Instagram",text:"Buen entrenamiento hoy. ¿Partido el sábado? 💪",kind:"friend"},
{who:"Envigado FC · Cuenta oficial",app:"Twitter / X",text:"Estamos siguiendo a jóvenes talentos de la región 👀",kind:"club"},
{who:"Valentina · Amiga",app:"Instagram",text:"La disciplina se nota más que las palabras ✨",kind:"friend"},
{who:"Fútbol Total",app:"Twitter / X",text:"Rumor: varios clubes buscan delanteros jóvenes esta temporada.",kind:"media"},
{who:"Aficionado",app:"Twitter / X",text:"¿Creen que esta promesa merece una oportunidad en primera?",kind:"fan"},
{who:"Tu familia",app:"Instagram",text:"Siempre orgullosos de ti. No olvides de dónde vienes ❤️",kind:"family"}
];
function openSocial(app="Instagram"){s.socialPosts=s.socialPosts||[];let own=s.socialPosts.map(p=>({who:s.name,app:p.app,text:p.text,kind:"own",likes:p.likes}));let feed=[...own,...SOCIAL_FEED.filter(p=>app==="Todos"||p.app===app)];modal(app,`<div class="row"><span class="pill">📸 Instagram</span><span class="pill">🐦 Twitter / X</span></div><p class="sub">Seguidores: ${Math.max(12,Math.round(s.hype*127))} · Reputación ${Math.round(s.hype)}/100</p><div class="item"><div><b>✍️ Crear publicación</b><div class="tiny">Tus publicaciones pueden mejorar tu imagen o causar polémica.</div></div><button class="btn green" onclick="composePost('${app}')">Publicar</button></div><div class="row"><button class="btn secondary" onclick="openSocial('Instagram')">Instagram</button><button class="btn secondary" onclick="openSocial('Twitter / X')">Twitter / X</button><button class="btn secondary" onclick="openSocial('Todos')">Todos</button></div><h3 class="section-title">Feed</h3>${feed.slice(0,14).map(p=>`<div class="item" style="display:block"><b>${esc(p.who)}</b><div class="tiny">${esc(p.app)} · ${p.kind==="own"?"Tu publicación":"Publicado recientemente"}</div><p style="line-height:1.45">${esc(p.text)}</p>${p.kind==="own"?`<span class="pill">❤️ ${p.likes||0}</span>`:`<button class="btn secondary" onclick="reactPost('${p.kind}','${p.who}')">❤️ Me gusta</button>`}</div>`).join("")}`)}
function composePost(app){modal("Crear publicación",`<p class="sub">Elige qué publicar en ${esc(app)}.</p><button class="choice" onclick="publishPost('${app}','training')"><b>🏋️ Día de trabajo</b><span class="tiny">El esfuerzo de hoy construye el jugador de mañana.</span></button><button class="choice" onclick="publishPost('${app}','team')"><b>🤝 Apoyar al equipo</b><span class="tiny">Primero el equipo. Vamos por más.</span></button><button class="choice" onclick="publishPost('${app}','bold')"><b>🔥 Mensaje desafiante</b><span class="tiny">Estoy listo para demostrar mi nivel. Puede generar polémica.</span></button><button class="choice" onclick="publishPost('${app}','life')"><b>❤️ Mensaje personal</b><span class="tiny">Agradecido por quienes siempre están.</span></button>`)}
function publishPost(app,type){let posts={training:"El esfuerzo de hoy construye el jugador de mañana. 💪",team:"Primero el equipo. Vamos por más. 🤝",bold:"Estoy listo para demostrar mi nivel. 🔥",life:"Agradecido por quienes siempre están. ❤️"};let text=posts[type],likes=8+Math.floor(Math.random()*90);s.socialPosts=s.socialPosts||[];s.socialPosts.unshift({app,text,likes});s.socialPosts=s.socialPosts.slice(0,20);if(type==="training"){s.hype+=2;s.coachTrust+=2;}if(type==="team"){s.hype+=3;s.coachTrust+=3;}if(type==="bold"){s.hype+=6;if(Math.random()<.35){s.scandal++;s.coachTrust-=4;addNews("Tu mensaje desafiante generó polémica y el técnico pidió humildad.");}}if(type==="life"){s.relationship=clamp(s.relationship+4);s.morale=clamp(s.morale+3);}addNews("Publicaste en "+app+": "+text);save();openSocial(app);render()}
function reactPost(kind,who){if(kind==="friend"||kind==="family")s.relationship=clamp(s.relationship+1);if(kind==="club")s.hype+=1;addNews("Interactuaste con la publicación de "+who+".");save();openSocial("Todos");render()}
function openRelations(){let partner=s.partner||"";modal("Amigos, clubes y pareja",`<div class="item"><div><b>🤝 Mateo Ríos · Amigo</b><div class="tiny">Relación ${Math.round(s.relationship||50)}/100. Puede animarte durante una mala racha.</div></div><button class="btn" onclick="messageFriend()">Escribir</button></div><div class="item"><div><b>🏟️ Clubes que te observan</b><div class="tiny">Las cuentas oficiales comentan sobre promesas y rendimiento.</div></div><button class="btn" onclick="openSocial('Twitter / X')">Ver publicaciones</button></div><div class="item"><div><b>💞 Pareja</b><div class="tiny">${partner?("Estás saliendo con "+esc(partner)):"Actualmente estás soltero/a."}</div></div><button class="btn" onclick="relationshipOptions()">Opciones</button></div>`)}
function messageFriend(){s.relationship=clamp((s.relationship||50)+5);s.morale=clamp(s.morale+2);addNews("Tu amigo Mateo te animó antes de la próxima jornada.");openRelations();render()}
function relationshipOptions(){modal("Vida sentimental",`<p class="sub">Tus relaciones necesitan tiempo y atención, igual que tu carrera.</p><button class="choice" onclick="startRelationship()">💬 Invitar a Valentina a tomar un café · $40</button><button class="choice" onclick="messagePartner()">📱 Enviar un mensaje amable · Gratis</button>${s.partner?'<button class="choice" onclick="endRelationship()">Terminar la relación</button>':""}<button class="btn secondary" onclick="openRelations()">Volver</button>`)}
function startRelationship(){if(s.money<40){alert("No tienes suficiente dinero.");return;}s.money-=40;s.partner="Valentina";s.relationship=clamp((s.relationship||50)+8);s.morale=clamp(s.morale+5);addNews("Tú y Valentina empezaron a salir. Tus decisiones y el tiempo afectarán la relación.");save();openRelations();render()}
function messagePartner(){if(s.partner){s.relationship=clamp((s.relationship||50)+3);s.morale=clamp(s.morale+2);addNews("Te tomaste un momento para cuidar tu relación.");}else addNews("Le enviaste un mensaje amable a Valentina; quizás se conozcan mejor.");save();openRelations();render()}
function endRelationship(){s.partner="";s.morale=clamp(s.morale-5);addNews("Terminaste la relación y decidiste centrarte en tu carrera.");save();openRelations();render()}
function openLife(){modal("Vida personal",`<div class="item"><div><b>👨‍👩‍👧 Cena familiar</b><div class="tiny">+15 moral, mejora relación</div></div><button class="btn" onclick="life('family')">Ir · $60</button></div><div class="item"><div><b>📸 Instagram</b><div class="tiny">Publicaciones, comentarios y seguidores</div></div><button class="btn" onclick="openSocial('Instagram')">Abrir</button></div><div class="item"><div><b>🐦 Twitter / X</b><div class="tiny">Rumores, clubes, fans y respuestas</div></div><button class="btn" onclick="openSocial('Twitter / X')">Abrir</button></div><div class="item"><div><b>💬 Amigos, clubes y pareja</b><div class="tiny">Consulta tus relaciones y habla con personas cercanas</div></div><button class="btn" onclick="openRelations()">Ver</button></div><div class="item"><div><b>😴 Recuperación</b><div class="tiny">+35 energía, +12 forma</div></div><button class="btn" onclick="life('rest')">Descansar</button></div><div class="item"><div><b>🎙️ Entrevista</b><div class="tiny">Decide cómo responder a la prensa</div></div><button class="btn" onclick="life('press')">Responder</button></div><div class="item"><div><b>🤝 Agentes y marcas</b><div class="tiny">Negocia patrocinios con marcas de ropa y deporte.</div></div><button class="btn" onclick="openSponsors()">Abrir</button></div><div class="item"><div><b>🌟 Red de profesionales</b><div class="tiny">Perfiles de estrellas y actividad pública.</div></div><button class="btn" onclick="openPros()">Ver perfiles</button></div><div class="item"><div><b>💳 Economía personal</b><div class="tiny">Ingresos, gastos y contratos vigentes.</div></div><button class="btn" onclick="openEconomy()">Consultar</button></div>`)}
function life(a){if(a==="family"){if(s.money<60)return alert("No tienes suficiente dinero.");s.money-=60;s.morale+=15;s.relationship=clamp(s.relationship+8);addNews("Cenaste con tu familia y recuperaste perspectiva.")}if(a==="social"){if(Math.random()<.72){s.hype+=5;addNews("Tu publicación conectó con los aficionados.")}else{s.hype+=2;s.scandal++;s.coachTrust-=2;addNews("Una publicación fuera de contexto genera polémica.")}}if(a==="rest"){s.energy+=35;s.fitness+=12;s.morale+=4;addNews("Priorizaste la recuperación.")}if(a==="press"){modal("Zona mixta",`<p>Un periodista pregunta por tu suplencia. ¿Qué respondes?</p><button class="choice" onclick="press('humble')"><b>“Seguiré trabajando por el equipo”</b><span class="tiny">Mejora la confianza</span></button><button class="choice" onclick="press('bold')"><b>“Merezco jugar más”</b><span class="tiny">Más fama, pero arriesgas la relación</span></button>`);return}closeModal();clampAll();render()}
function press(k){if(k==="humble"){s.coachTrust+=5;s.morale+=2;addNews("La prensa valora tu respuesta centrada en el equipo.")}else{s.hype+=5;if(Math.random()<.45){s.scandal++;s.coachTrust-=8;addNews("El técnico no encaja bien tus declaraciones.")}else addNews("Tus declaraciones generan debate.")}closeModal();clampAll();render()}
function openCareer(){let h=`<p class="sub">OVR ${ovr()}. Los clubes exigen nivel y afición.</p>`;Object.entries(CLUBS).forEach(([n,c])=>{if(n===s.club)return;let ok=ovr()>=c.ovr&&s.hype>=Math.max(0,c.ovr-45);h+=`<div class="item"><div style="flex:1"><b>${esc(n)}</b><div class="tiny">${esc(c.league)} · Req. OVR ${c.ovr}</div><div class="tiny">Sueldo semanal $${c.salary.toLocaleString("es-CO")}</div></div><button class="btn" ${ok?"":"disabled"} onclick="offer('${esc(n)}')">${ok?"Negociar":"Bloqueado"}</button></div>`});modal("Mercado de fichajes",h)}
function offer(n){let c=CLUBS[n];if(!c||ovr()<c.ovr||s.hype<Math.max(0,c.ovr-45))return;modal("Oferta de contrato",`<p><b>${esc(n)}</b> ofrece contrato por una temporada.</p><div class="item"><span>Sueldo semanal</span><b>$${c.salary.toLocaleString("es-CO")}</b></div><button class="choice" onclick="transfer('${esc(n)}',false)"><b>Aceptar oferta</b></button><button class="choice" onclick="transfer('${esc(n)}',true)"><b>Negociar un 15% más</b><span class="tiny">Hay 65% de posibilidad de que acepten</span></button>`)}
function transfer(n,neg){let c=CLUBS[n];if(neg&&Math.random()>.65){addNews(`${n} retiró la oferta tras la negociación.`);closeModal();return render()}s.club=n;s.salary=Math.round(c.salary*(neg?1.15:1));s.morale=clamp(s.morale+8);s.coachTrust=35;s.newCareer=false;addNews(`Fichaje confirmado: ${n}. Salario semanal $${s.salary.toLocaleString("es-CO")}.`);closeModal();render()}
function openShop(){modal("Tienda",`<p class="sub">Dinero disponible: <b>$${s.money.toLocaleString("es-CO")}</b></p><p class="tiny">Precios en pesos del juego. Cada tarjeta muestra el precio y si puedes comprarlo.</p>${SHOP.map(i=>`<div class="item"><span style="font-size:22px">${i.icon}</span><div style="flex:1"><b>${esc(i.name)}</b><div class="tiny">${esc(i.desc)}</div></div><button class="btn" ${s.assets.includes(i.id)||s.money<i.price?"disabled":""} onclick="buy('${i.id}')">${s.assets.includes(i.id)?"Comprado":s.money<i.price?"Faltan $"+(i.price-s.money).toLocaleString("es-CO"):"Comprar · $"+i.price.toLocaleString("es-CO")}</button></div>`).join("")}`)}
function buy(id){let i=SHOP.find(x=>x.id===id);if(!i||s.assets.includes(id)||s.money<i.price)return;s.money-=i.price;s.assets.push(id);if(i.type==="hype")s.hype+=i.value;if(i.type==="fitness")s.fitness=clamp(s.fitness+i.value);if(i.type==="morale")s.morale=clamp(s.morale+i.value);addNews(`Compraste ${i.name} por $${i.price.toLocaleString("es-CO")}.`);openShop();render()}
function openStyle(){modal("Personalizar jugador",`<label class="sub">Nombre</label><input class="field" id="nameInput" maxlength="24" value="${esc(s.name)}"><label class="sub">Dorsal (1–99)</label><input class="field" id="numInput" type="number" min="1" max="99" value="${s.number}"><button class="btn green" style="width:100%" onclick="saveStyle()">Guardar cambios</button><p class="sub">Tono de piel</p><div class="row">${["#f3c7a4","#c68642","#8d5524","#4a2c20"].map(c=>`<button class="btn secondary" style="width:48px;height:42px;background:${c}" onclick="skin('${c}')"></button>`).join("")}</div><p class="sub">Cabello</p><div class="row"><button class="btn secondary" onclick="hair('corto')">Corto</button><button class="btn secondary" onclick="hair('rubio')">Rubio</button><button class="btn secondary" onclick="hair('rapado')">Rapado</button></div>`)}
function saveStyle(){let n=$("nameInput").value.trim().slice(0,24),d=Number($("numInput").value);if(n)s.name=n;if(Number.isInteger(d)&&d>=1&&d<=99)s.number=d;closeModal();render();addNews("Actualizaste tu identidad de jugador.")}
function skin(c){s.avatar.skin=c;render();openStyle()}function hair(h){s.avatar.hair=h;render();openStyle()}
function openHistory(){modal("Historia y estadísticas",`<div class="item"><span>Partidos</span><b>${s.matches}</b></div><div class="item"><span>Victorias / Empates / Derrotas</span><b>${s.wins}/${s.draws}/${s.losses}</b></div><div class="item"><span>Goles / Asistencias</span><b>${s.goals}/${s.assists}</b></div><div class="item"><span>Confianza del técnico</span><b>${Math.round(clamp(s.coachTrust))}/100</b></div><div class="item"><span>Relación familiar</span><b>${Math.round(clamp(s.relationship))}/100</b></div><div class="item"><span>Polémicas</span><b>${s.scandal}</b></div><h3 class="section-title">Crónica</h3>${s.history.map(n=>`<div class="feed"><span class="tiny">Temporada ${n.season} · Semana ${n.week}</span><br>${esc(n.msg)}</div>`).join("")||"<p class='sub'>Tu historia está por escribirse.</p>"}<button class="btn secondary" onclick="exportSave()">Exportar partida</button> <button class="btn red" onclick="resetConfirm()">Nueva carrera</button>`)}
function exportSave(){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:"application/json"}));a.href=u;a.download="pro-football-save.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function resetConfirm(){modal("Nueva carrera",`<p>Se borrará el progreso guardado de esta versión en este navegador. No se puede deshacer.</p><button class="btn red" style="width:100%" onclick="resetGame()">Borrar progreso y empezar</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="openHistory()">Cancelar</button>`)}

function clampAll(){s.energy=clamp(s.energy);s.fitness=clamp(s.fitness);s.morale=clamp(s.morale);s.hype=clamp(s.hype);s.coachTrust=clamp(s.coachTrust);s.relationship=clamp(s.relationship);s.money=Math.max(0,Math.floor(s.money))}
function endSeason(){let award=s.seasonGoals>=8?"Temporada goleadora: prima de $1.000.":s.wins>=8?"Buen año colectivo: prima de $500.":"Temporada difícil: el técnico espera una reacción.";s.money+=s.seasonGoals>=8?1000:s.wins>=8?500:0;let recap=`Fin de temporada ${s.season}: ${s.seasonMatches} partidos, ${s.seasonGoals} goles, ${s.seasonAssists} asistencias. ${award}`;addNews(recap);s.season++;s.week=1;s.day=1;s.seasonGoals=0;s.seasonAssists=0;s.seasonMatches=0;s.wins=0;s.losses=0;s.draws=0;s.energy=100;s.fitness=85;s.morale=75;s.playedToday=false;if(s.scandal>=3){s.coachTrust-=10;addNews("Las polémicas pesan en la evaluación de pretemporada.")}s.scandal=Math.max(0,s.scandal-1);clampAll();render();modal("Cierre de temporada",`<p>${esc(recap)}</p><p>Comienza la temporada ${s.season}. Tu club, atributos, reputación y relaciones se mantienen.</p><button class="btn green" style="width:100%" onclick="closeModal()">Empezar temporada ${s.season}</button>`)}

function openPros(){modal("🌟 Red de profesionales",`<p class="sub">Perfiles públicos de futbolistas reales. Las publicaciones que aparecen aquí son descripciones del juego, no mensajes reales ni contactos personales.</p>${PRO_PLAYERS.map(p=>`<div class="item" style="display:block"><div class="row"><b>${esc(p.name)}</b><span class="pill">${esc(p.position)}</span></div><div class="tiny">${esc(p.club)}</div><p style="line-height:1.45;margin-bottom:0">${esc(p.note)}</p></div>`).join("")}<button class="btn secondary" style="width:100%" onclick="openSocial('Todos')">Volver a redes del juego</button>`)}
function openSponsors(){
 const active=s.sponsors||[];
 let html=`<p class="sub">Los acuerdos son ficticios y equilibrados para el juego. El dinero está en unidades de la economía del juego, no representa tarifas reales.</p><div class="item"><div><b>Reputación</b><div class="tiny">Fama ${Math.round(s.hype)}/100 · OVR ${ovr()}</div></div><span class="pill">${active.length} contrato(s)</span></div><h3 class="section-title">Contratos activos</h3>`;
 html+=active.length?active.map(c=>`<div class="item"><div style="flex:1"><b>${esc(c.name)}</b><div class="tiny">+$${c.weekly.toLocaleString("es-CO")}/semana · Prima $${c.bonus.toLocaleString("es-CO")}</div><div class="tiny">Objetivo: ${esc(c.goal)}</div></div><button class="btn red" onclick="endSponsor('${esc(c.name)}')">Terminar</button></div>`).join(""):'<p class="sub">Todavía no tienes patrocinadores.</p>';
 html+='<h3 class="section-title">Ofertas disponibles</h3>';
 html+=BRANDS.map(b=>{let activeNow=active.some(c=>c.name===b.name),can=ovr()>=b.min&&s.hype>=Math.max(15,b.min-15)&&!activeNow;return `<div class="item"><div style="flex:1"><b>${esc(b.name)}</b><div class="tiny">${esc(b.type)} · Requisito OVR ${b.min}</div><div class="tiny">+$${b.weekly.toLocaleString("es-CO")}/semana · Prima $${b.bonus.toLocaleString("es-CO")}</div><div class="tiny">${esc(b.goal)}</div></div><button class="btn" ${can?'':'disabled'} onclick="signSponsor('${esc(b.name)}')">${activeNow?'Firmado':can?'Negociar':'No disponible'}</button></div>`}).join('');
 modal("🤝 Agentes y marcas",html);
}
function signSponsor(name){const b=BRANDS.find(x=>x.name===name);if(!b||s.sponsors.some(x=>x.name===name)||ovr()<b.min||s.hype<Math.max(15,b.min-15))return;const deal={name:b.name,type:b.type,weekly:b.weekly,bonus:b.bonus,goal:b.goal,signedWeek:s.week};s.sponsors.push(deal);s.money+=Math.round(b.bonus*.35);s.hype=clamp(s.hype+2);addNews(`Firmaste con ${b.name}. Recibiste una prima de bienvenida de $${Math.round(b.bonus*.35).toLocaleString("es-CO")}.`);save();openSponsors();render()}
function endSponsor(name){const c=s.sponsors.find(x=>x.name===name);if(!c)return;s.sponsors=s.sponsors.filter(x=>x.name!==name);addNews(`Terminaste el contrato publicitario con ${name}; dejaste de recibir sus pagos semanales.`);save();openSponsors();render()}
function openEconomy(){let weeklyClub=s.salary,weeklyBrands=(s.sponsors||[]).reduce((n,c)=>n+c.weekly,0),expenses=Math.max(100,Math.round(s.salary*.22))+150;modal("💳 Economía personal",`<div class="item"><span>Saldo disponible</span><b class="money">$${s.money.toLocaleString("es-CO")}</b></div><div class="item"><span>Sueldo del club / semana</span><b>$${weeklyClub.toLocaleString("es-CO")}</b></div><div class="item"><span>Patrocinios / semana</span><b>$${weeklyBrands.toLocaleString("es-CO")}</b></div><div class="item"><span>Ingresos de marcas acumulados</span><b>$${(s.brandIncome||0).toLocaleString("es-CO")}</b></div><div class="item"><span>Gastos acumulados</span><b>$${(s.expenses||0).toLocaleString("es-CO")}</b></div><div class="item"><span>Gasto estimado cada 4 semanas</span><b>$${expenses.toLocaleString("es-CO")}</b></div><p class="sub">La economía se basa en sueldo semanal, pagos de patrocinadores, gastos de vida y primas. Los valores son ficticios y se escalan según el nivel de tu contrato.</p><button class="btn green" style="width:100%" onclick="openSponsors()">Gestionar patrocinadores</button>`)}
const AUTO_EVENTS=[
 {type:"family",title:"📞 Llamada de tu familia",text:"Tu familia quiere saber cómo estás llevando la presión de la carrera.",choices:[{label:"Llamarlos y hablar con calma",desc:"Mejora la relación y la moral.",run:()=>{s.relationship=clamp(s.relationship+8);s.morale=clamp(s.morale+5);addNews("Hiciste tiempo para hablar con tu familia.");}},{label:"Decir que estás ocupado",desc:"Ganas tiempo, pero pueden sentirse apartados.",run:()=>{s.relationship=clamp(s.relationship-4);s.coachTrust=clamp(s.coachTrust+1);addNews("Pospusiste la llamada familiar. Tu familia te extraña.");}}]},
 {type:"club",title:"🏟️ Mensaje del entrenador",text:"El entrenador te escribe: quiere saber si estás listo para ganarte minutos este fin de semana.",choices:[{label:"Prometer trabajo y disciplina",desc:"Sube la confianza del técnico.",run:()=>{s.coachTrust=clamp(s.coachTrust+6);s.morale=clamp(s.morale+2);addNews("Le prometiste al entrenador que responderás con trabajo.");}},{label:"Exigir más oportunidades",desc:"Puede darte visibilidad, pero arriesgas confianza.",run:()=>{s.hype=clamp(s.hype+3);if(Math.random()<.4){s.coachTrust=clamp(s.coachTrust-6);addNews("El técnico cree que debes demostrar más antes de exigir minutos.");}else{ s.coachTrust=clamp(s.coachTrust+2);addNews("El técnico aceptó hablar sobre tu rol en el equipo.");}}}]},
 {type:"press",title:"🎙️ Invitación a una entrevista",text:"Un periodista local quiere hacerte unas preguntas sobre tu futuro.",choices:[{label:"Hablar con humildad del equipo",desc:"Mejora la confianza y la imagen.",run:()=>{s.coachTrust=clamp(s.coachTrust+4);s.hype=clamp(s.hype+2);addNews("La entrevista destacó tu humildad y compromiso.");}},{label:"Decir que naciste para ser estrella",desc:"Ganas atención; existe riesgo de polémica.",run:()=>{s.hype=clamp(s.hype+6);if(Math.random()<.45){s.scandal=(s.scandal||0)+1;s.coachTrust=clamp(s.coachTrust-5);addNews("La entrevista se volvió polémica por tus declaraciones.");}else addNews("Tu confianza llamó la atención de algunos aficionados.");}}]},
 {type:"social",title:"📱 Tu nombre es tendencia",text:"Un clip de tu entrenamiento circula en redes. La gente debate si mereces una oportunidad.",choices:[{label:"Agradecer el apoyo",desc:"Sube la afición y la moral.",run:()=>{s.hype=clamp(s.hype+4);s.morale=clamp(s.morale+3);addNews("Agradeciste los mensajes de apoyo en redes.");}},{label:"Responder a los críticos",desc:"Más visibilidad, con riesgo de polémica.",run:()=>{s.hype=clamp(s.hype+5);if(Math.random()<.35){s.scandal=(s.scandal||0)+1;addNews("Una respuesta impulsiva generó discusión en redes.");}else addNews("Tu respuesta recibió apoyo de varios aficionados.");}}]},
 {type:"partner",title:"💬 Mensaje de alguien cercano",text:"Valentina te escribe para proponerte un plan. La temporada te está quitando mucho tiempo.",choices:[{label:"Reservar un rato para hablar",desc:"Mejora la relación y la moral.",run:()=>{s.relationship=clamp(s.relationship+7);s.morale=clamp(s.morale+3);addNews("Dedicastes tiempo a una persona importante para ti.");}},{label:"Priorizar el entrenamiento",desc:"Sube un poco la confianza, pero la relación se enfría.",run:()=>{s.coachTrust=clamp(s.coachTrust+2);s.relationship=clamp(s.relationship-5);addNews("Priorizaste el fútbol y dejaste el mensaje para más tarde.");}}]}
];
function triggerLifeEvent(){
 if($("overlay").style.display==="flex"||s.pendingEvent)return;
 let pool=AUTO_EVENTS.filter(e=>e.type!=="partner"||s.partner||s.relationship>=65);
 if(s.day===5)pool=pool.filter(e=>e.type!=="family");
 if(!pool.length)return;
 let ev=pool[Math.floor(Math.random()*pool.length)];s.pendingEvent={type:ev.type,week:s.week,day:s.day};save();
 modal(ev.title,`<p style="line-height:1.55">${esc(ev.text)}</p><div class="pill">${DAYS[s.day-1]} · Semana ${s.week}</div>${ev.choices.map((c,i)=>`<button class="choice" onclick="resolveLifeEvent(${pool.indexOf(ev)},${i})"><b>${esc(c.label)}</b><span class="tiny">${esc(c.desc)}</span></button>`).join("")}<p class="tiny">Estos eventos aparecen automáticamente al avanzar los días.</p>`);
}
function resolveLifeEvent(eventIndex,choiceIndex){
 let pool=AUTO_EVENTS.filter(e=>e.type!=="partner"||s.partner||s.relationship>=65);if(s.day===5)pool=pool.filter(e=>e.type!=="family");
 const ev=pool[eventIndex],ch=ev&&ev.choices[choiceIndex];if(!ch)return;
 ch.run();s.pendingEvent=null;clampAll();save();closeModal();render();
}
const oldCloseModal=closeModal;
closeModal=function(){oldCloseModal();if(s.pendingEvent){s.pendingEvent=null;save();}}
if(!load()){s=fresh();save()}render();if(!s.history.length)addNews("Carrera nueva: demuestra que mereces una oportunidad en el Club de Barrio.");
</script></body></html>
